<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Die Vogel-Insel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Russo+One&display=swap">
<style>
:root{
  --bg:#070b16; --glass:rgba(11,17,33,.84); --glass-2:rgba(22,32,58,.94); --line:rgba(125,170,255,.26); --txt:#eef4ff; --muted:#9fb0cc;
  --cyan:#3de0ff; --lime:#a6ff4d; --amber:#ffc83d; --coral:#ff5d6c; --violet:#b26bff;
  --der:#8fbcff; --die:#ff9aa3; --das:#7ff0b0; --ok:#7ff0b0; --bad:#ff7a86; --warn:#ffc83d;
  --field:#0d1528; --field-line:rgba(125,170,255,.35); --chip:#16223d;
  --display:'Russo One', 'Arial Black', 'Trebuchet MS', sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html, body{ height:100%; }
[hidden]{ display:none !important; }
body{ margin:0; background:var(--bg); color:var(--txt); font-family:var(--body); overflow:hidden; user-select:none; -webkit-user-select:none; }
input, textarea, select{ user-select:text; -webkit-user-select:text; }
#cv{ position:fixed; inset:0; width:100vw; height:100vh; display:block; outline:none; }
button{ font:inherit; }
:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
.art-der{ color:var(--der); } .art-die{ color:var(--die); } .art-das{ color:var(--das); }
.es-inline{ color:#c9b88f; font-style:italic; font-size:.92em; }
.muted{ color:var(--muted); }

/* ---------- HUD ---------- */
#hud{ position:fixed; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:flex-start; padding:12px 16px; pointer-events:none; gap:10px; z-index:3; }
.hud-l, .hud-r{ display:flex; gap:8px; align-items:center; pointer-events:auto; flex-wrap:wrap; }
.pill{ background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:5px 12px; font-family:var(--display); font-size:17px; display:flex; gap:8px; align-items:center; white-space:nowrap; backdrop-filter:blur(6px); }
#h-hearts{ display:flex; gap:2px; } #h-hearts span{ color:#ff4d5e; font-size:22px; line-height:1; text-shadow:0 0 8px rgba(255,77,94,.6); } #h-hearts .empty{ color:#3a2a33; text-shadow:none; }
.lvl{ display:flex; align-items:center; gap:8px; } #h-level{ background:var(--amber); color:#241a00; border-radius:6px; padding:0 6px; font-size:14px; } #h-title{ font-size:15px; }
.xpbar{ width:90px; height:7px; background:#1c2742; border-radius:4px; overflow:hidden; } .xpbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg, var(--amber), #ffe78a); transition:width .4s; }
#h-combo{ background:linear-gradient(90deg, #ff7a1a, #ff3d6e); border:none; color:#fff; animation:pop .3s; }
.iconbtn{ width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--glass); color:var(--txt); font-size:18px; cursor:pointer; display:grid; place-items:center; padding:0; }
.iconbtn:hover{ border-color:var(--cyan); } .iconbtn.off{ opacity:.4; }
#banner{ position:fixed; top:64px; left:50%; transform:translateX(-50%); width:min(760px, calc(100% - 32px)); background:var(--glass-2); border:1px solid var(--line); border-radius:16px; padding:10px 18px; text-align:center; z-index:3; box-shadow:0 10px 30px rgba(0,0,0,.35); pointer-events:none; }
#banner .b-main{ font-size:22px; font-weight:700; line-height:1.3; }
#banner .b-sub{ font-size:14px; color:var(--muted); margin-top:3px; }
#banner .b-sub:empty{ display:none; }
#banner .b-num{ font-family:var(--display); font-size:14px; color:#241a00; background:var(--amber); border-radius:6px; padding:1px 6px; margin-right:6px; vertical-align:3px; }
#banner .es-big{ color:var(--amber); font-style:italic; font-size:26px; }
#banner .b-media{ display:inline-block; width:210px; vertical-align:middle; margin-right:10px; }
#banner .b-media .diag{ border-radius:8px; }
#banner .def{ display:inline; background:none; border:none; padding:0; }
#banner .say{ pointer-events:auto; }
#astat{ position:fixed; top:64px; right:16px; background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:14px; z-index:3; font-variant-numeric:tabular-nums; }
.bossbar{ display:grid; gap:4px; min-width:250px; } .bossbar span{ font-family:var(--display); color:#ffb3ba; } .bossbar .bar{ height:12px; background:#2a1620; border-radius:6px; overflow:hidden; } .bossbar .bar i{ display:block; height:100%; background:linear-gradient(90deg, #ff3d6e, #ff9a3d); transition:width .3s; } .bossbar small{ color:var(--muted); }
#crosshair{ position:fixed; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%, -50%); z-index:2; pointer-events:none; }
#crosshair::before, #crosshair::after{ content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 3px #000; }
#crosshair::before{ left:10px; top:0; width:2px; height:22px; } #crosshair::after{ top:10px; left:0; height:2px; width:22px; }
#ammo{ position:fixed; bottom:16px; right:16px; display:flex; gap:8px; z-index:3; max-width:calc(100% - 32px); flex-wrap:wrap; justify-content:center; }
#ammo .slot{ font-family:var(--display); font-size:20px; min-width:92px; padding:8px 14px; border-radius:12px; border:2px solid transparent; color:#fff; cursor:pointer; opacity:.55; display:flex; gap:8px; align-items:center; justify-content:center; }
#ammo .slot.der{ background:#2e5fd8; } #ammo .slot.die{ background:#d6344a; } #ammo .slot.das{ background:#16a35a; }
#ammo .slot.on{ opacity:1; border-color:#fff; transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.4); }
#ammo kbd, .beak kbd{ background:rgba(0,0,0,.3); border-radius:5px; padding:0 6px; font-size:13px; color:#fff; border:none; }
#ammo .beak{ background:var(--glass-2); border:2px solid var(--line); border-radius:12px; padding:6px 10px; color:var(--txt); cursor:pointer; display:grid; text-align:left; min-width:120px; }
#ammo .beak b{ font-size:14px; } #ammo .beak small{ font-size:12px; color:var(--muted); } #ammo .beak.on{ border-color:var(--lime); background:#1d3a24; transform:translateY(-3px); }
#prompt{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--glass-2); border:1px solid var(--cyan); border-radius:12px; padding:8px 16px; font-size:17px; font-weight:700; z-index:3; box-shadow:0 0 18px rgba(61,224,255,.25); }
#prompt kbd{ font-family:var(--display); background:var(--cyan); color:#032530; border-radius:6px; padding:1px 8px; margin-right:6px; border:none; }
#quest{ position:fixed; left:16px; bottom:16px; max-width:min(520px, calc(100% - 400px)); background:var(--glass); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:10px; padding:8px 12px; font-size:14px; line-height:1.35; z-index:2; }
#quest b{ font-family:var(--display); font-weight:400; color:var(--amber); letter-spacing:.06em; margin-right:6px; }
#toasts{ position:fixed; top:150px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:6; pointer-events:none; width:min(560px, calc(100% - 32px)); }
.toast{ background:var(--glass-2); border:1px solid var(--line); border-radius:10px; padding:7px 14px; font-size:15px; text-align:center; animation:tin .25s ease-out; transition:opacity .4s, transform .4s; }
.toast.out{ opacity:0; transform:translateY(-8px); } .toast.gold{ border-color:var(--amber); } .toast.ok{ border-color:var(--lime); } .toast.bad{ border-color:var(--coral); }
.toast.zone{ font-family:var(--display); font-size:22px; letter-spacing:.03em; } .toast.zone .es-inline{ font-family:var(--body); font-size:14px; }
#popups{ position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
.pop{ position:absolute; left:0; top:0; font-family:var(--display); font-size:20px; color:#fff; text-shadow:0 2px 0 #000, 0 0 10px rgba(0,0,0,.7); white-space:nowrap; }
.pop b{ font-family:var(--body); } .pop.bad{ color:#ffb3ba; font-size:18px; } .pop.crit{ color:var(--amber); font-size:30px; }
#hurt{ position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(255,40,60,.55)); }
#hurt.on{ animation:hurt .5s ease-out; }
#clickhint{ position:fixed; bottom:88px; right:16px; background:var(--glass); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--muted); z-index:2; }
@keyframes hurt{ 0%{ opacity:1; } 100%{ opacity:0; } }
@keyframes tin{ from{ opacity:0; transform:translateY(-10px); } }
@keyframes pop{ 50%{ transform:scale(1.12); } }

/* ---------- sheets ---------- */
#modal{ position:fixed; inset:0; background:rgba(3,6,14,.55); display:grid; place-items:center; grid-template-columns:minmax(0, 1fr); z-index:8; backdrop-filter:blur(3px); }
.sheet{ box-sizing:border-box; min-width:0; background:var(--glass-2); color:var(--txt); width:680px; max-width:calc(100% - 32px); max-height:calc(100vh - 48px); overflow:auto; border-radius:18px; padding:20px 24px 18px; border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.55); }
.sheet.wide{ width:920px; }
.sheet h1{ font-family:var(--display); font-weight:400; font-size:clamp(40px, 7vw, 72px); line-height:1; margin:6px 0 10px; letter-spacing:.01em; background:linear-gradient(180deg, #fff, #ffd66b 60%, #ff9a3d); -webkit-background-clip:text; background-clip:text; color:transparent; text-wrap:balance; }
.sheet h2{ font-family:var(--display); font-weight:400; font-size:26px; margin:0 0 8px; letter-spacing:.02em; text-wrap:balance; }
.sheet h3{ font-family:var(--display); font-weight:400; font-size:18px; margin:18px 0 6px; color:var(--cyan); letter-spacing:.03em; }
.sheet p{ margin:6px 0; line-height:1.45; }
.big-title{ font-size:40px !important; background:linear-gradient(180deg, #fff, #ffd66b); -webkit-background-clip:text; background-clip:text; color:transparent; }
.eyebrow{ text-transform:uppercase; letter-spacing:.2em; font-size:12px; color:var(--cyan); margin:0; }
.sheet .es{ color:#e0c98f; font-style:italic; }
.sub{ color:var(--muted); }
.center{ text-align:center; }
.center-actions{ justify-content:center !important; }
.series-head, .term-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.prog{ font-family:var(--display); color:var(--muted); font-size:16px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.btn{ font-family:var(--display); font-size:17px; letter-spacing:.03em; background:linear-gradient(180deg, #ffd24a, #ff9f1a); color:#2a1700; border:none; border-radius:12px; padding:9px 18px 8px; cursor:pointer; box-shadow:0 4px 0 #b86a00; }
.btn:hover{ filter:brightness(1.07); } .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #b86a00; }
.btn:disabled{ opacity:.4; cursor:default; filter:none; transform:none; }
.btn.alt{ background:linear-gradient(180deg, #57e8ff, #1fb3d8); color:#022530; box-shadow:0 4px 0 #0c6f88; }
.btn.ghost{ background:transparent; color:var(--txt); border:1px solid var(--line); box-shadow:none; }
.btn.tiny{ font-size:13px; padding:5px 10px 4px; box-shadow:0 3px 0 #b86a00; } .btn.ghost.tiny{ box-shadow:none; }
.btn.big{ font-size:24px; padding:13px 30px 11px; }
.btn.hold{ position:relative; overflow:hidden; } .btn.hold .fill{ position:absolute; inset:0; width:0; background:rgba(255,200,61,.25); } .btn.hold.holding .fill{ width:100%; transition:width 1.5s linear; }
.fb-actions{ display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:14px; flex-wrap:wrap; }
.say{ border:none; background:none; cursor:pointer; font-size:16px; padding:0 2px; vertical-align:middle; }
kbd{ font-family:var(--display); font-size:12px; background:#243152; border:1px solid var(--line); border-radius:5px; padding:0 6px; color:var(--muted); }

/* ---------- questions ---------- */
.q-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.q-prompt{ font-size:19px; line-height:1.4; }
.q-help{ background:rgba(255,200,61,.1); border-left:3px solid var(--amber); padding:6px 10px; border-radius:6px; margin:6px 0; color:#f0d9a0; font-style:italic; }
.help{ box-shadow:none !important; background:#2a3657 !important; color:var(--txt) !important; }
.big{ font-family:var(--display); font-size:34px; margin:4px 0; } .big small{ font-family:var(--body); font-size:15px; color:var(--muted); }
.big-es{ font-size:26px; font-weight:700; color:var(--amber); font-style:italic; margin:4px 0; }
.def{ font-size:18px; background:var(--field); border:1px dashed var(--field-line); border-radius:8px; padding:6px 10px; margin:6px 0; }
.blank{ letter-spacing:.1em; color:var(--amber); font-weight:700; }
.emoji-big{ font-size:30px; vertical-align:middle; }
.q-body{ display:flex; gap:14px; align-items:flex-start; margin-top:8px; flex-wrap:wrap; }
.q-media{ flex:0 0 300px; max-width:100%; } .q-media .diag{ width:100%; }
.q-main{ flex:1; min-width:240px; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .opts.art{ grid-template-columns:repeat(3, 1fr); }
.opt{ background:var(--chip); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:17px; text-align:left; cursor:pointer; display:flex; gap:8px; align-items:center; line-height:1.3; }
.opt:hover:not(:disabled){ border-color:var(--cyan); }
.opt.right{ background:#15402a; border-color:var(--ok); } .opt.wrong{ background:#4a1a22; border-color:var(--bad); } .opt:disabled{ cursor:default; }
.art-btn{ justify-content:center; font-family:var(--display); font-size:24px; color:#fff; border:none; }
.art-btn.art-der{ background:#2e5fd8; } .art-btn.art-die{ background:#d6344a; } .art-btn.art-das{ background:#16a35a; }
.art-btn.right{ box-shadow:0 0 0 3px var(--lime); } .art-btn.wrong{ opacity:.5; }
.art-btn kbd{ background:rgba(0,0,0,.25); color:#fff; border:none; }
.tf-r, .tf-f{ justify-content:center; font-family:var(--display); font-size:21px; }
.typerow{ display:flex; gap:8px; }
input.answer{ flex:1; font:inherit; font-size:22px; padding:8px 12px; border:1px solid var(--field-line); border-radius:10px; background:var(--field); color:var(--txt); min-width:0; }
input.right, select.right{ border-color:var(--ok) !important; background:#123524 !important; } input.close{ border-color:var(--warn) !important; background:#3a2e10 !important; } input.wrong, select.wrong, textarea.wrong{ border-color:var(--bad) !important; background:#3a141b !important; }
.umlauts{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
.uml{ font:inherit; font-size:17px; font-weight:700; width:36px; height:32px; border:1px solid var(--line); background:var(--chip); color:var(--txt); border-radius:8px; cursor:pointer; }
.timer{ height:6px; background:#1c2742; border-radius:3px; margin-top:10px; overflow:hidden; } .timer i{ display:block; height:100%; width:100%; background:linear-gradient(90deg, var(--coral), var(--amber)); }
.fb{ margin-top:10px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); animation:tin .2s; }
.fb.right{ border-color:rgba(127,240,176,.5); } .fb.wrong{ border-color:rgba(255,122,134,.5); } .fb.close{ border-color:rgba(255,200,61,.5); }
.fb-title{ font-family:var(--display); font-size:20px; } .fb-title.ok{ color:var(--ok); } .fb-title.bad{ color:var(--bad); } .fb-title.warn{ color:var(--warn); }
.fb-msg{ font-weight:700; margin:3px 0; } .fb-ex{ margin-top:4px; } .fb-ex .ex{ color:var(--muted); margin-top:2px; }
.combo{ background:linear-gradient(90deg, #ff7a1a, #ff3d6e); color:#fff; border-radius:999px; padding:0 8px; font-size:14px; }
.diag{ width:100%; height:auto; display:block; border-radius:10px; }
.diag .lead{ stroke:#3a2e22; stroke-width:1.4; } .diag .dot{ fill:#3a2e22; }
.diag .mk circle{ fill:#fffaf0; stroke:#3a2e22; stroke-width:2; } .diag .mk text{ font:700 13px var(--body); fill:#2a2119; pointer-events:none; }
.diag .mk.ok circle{ fill:#bfe8c9; stroke:#2f9e55; } .diag .mk.hi circle{ fill:#ffd66b; stroke:#b4531a; stroke-width:3; }

/* ---------- dialog, cards, inventory, shop ---------- */
.dlg{ display:flex; gap:16px; align-items:flex-start; }
.dlg-face{ flex:0 0 110px; } .dlg-face img{ width:110px; height:110px; border-radius:16px; background:radial-gradient(circle at 50% 40%, #2c3d66, #111a30); border:1px solid var(--line); display:block; }
.dlg-body{ flex:1; min-width:0; }
.dlg .who{ font-family:var(--display); font-size:18px; color:var(--amber); letter-spacing:.03em; }
.dlg .de{ font-size:19px; }
.dots{ margin-right:auto; display:flex; gap:4px; } .dots i{ width:8px; height:8px; border-radius:50%; background:#2a3657; } .dots i.on{ background:var(--amber); }
.menu-list, .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.quote{ font-size:19px; font-style:italic; }
.big-emoji{ font-size:54px; line-height:1.1; }
.score-big{ font-family:var(--display); font-size:52px; color:var(--amber); margin:0 !important; font-variant-numeric:tabular-nums; }
.stars-big{ font-size:54px; letter-spacing:.08em; margin:0 !important; color:#2a3657; } .stars-big .on{ color:var(--amber); text-shadow:0 0 16px rgba(255,200,61,.6); }
.stars-row{ color:var(--amber); font-size:22px; letter-spacing:.1em; margin:0 !important; }
.gold-note{ background:rgba(255,200,61,.12); border:1px solid var(--amber); border-radius:10px; padding:6px 12px; display:inline-block; }
.score-note{ font-family:var(--display); font-size:17px; color:var(--muted); margin-right:auto; }
.st-intro{ text-align:center; } .st-icon{ font-size:50px; } .st-intro .lead{ font-size:19px; font-weight:700; } .how{ background:var(--field); border:1px dashed var(--field-line); border-radius:10px; padding:6px 12px; display:inline-block; }
.label-wrap{ display:grid; grid-template-columns:1.35fr 1fr; gap:14px; align-items:start; }
.slots{ list-style:none; padding:0; margin:0; display:grid; gap:3px; font-size:16px; }
.slots li{ display:flex; gap:8px; align-items:center; min-height:26px; }
.slots .num{ font-family:var(--display); width:26px; height:26px; flex:0 0 26px; border-radius:50%; background:#fffaf0; color:#1d1712; display:grid; place-items:center; font-size:13px; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 2px; }
.chip{ background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:16px; cursor:pointer; color:var(--txt); }
.chip:hover:not(:disabled){ border-color:var(--cyan); } .chip.sel{ background:#3a3010; border-color:var(--amber); } .chip:disabled{ opacity:.3; cursor:default; }
.chip.shake{ animation:shake .35s; border-color:var(--bad); }
@keyframes shake{ 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
.cloze{ font-size:18px; line-height:2.1; background:var(--field); border:1px solid var(--field-line); border-radius:12px; padding:8px 14px; }
.gap{ min-width:90px; font:inherit; font-size:17px; border:none; border-bottom:3px solid var(--cyan); background:#15223f; border-radius:6px 6px 0 0; padding:0 8px; cursor:pointer; color:var(--txt); font-weight:700; }
.gap.sel{ background:#3a3010; border-bottom-color:var(--amber); } .gap.ok{ background:#123524; border-bottom-color:var(--ok); } .gap.bad{ background:#3a141b; border-bottom-color:var(--bad); text-decoration:line-through; }
.fix{ color:var(--ok); font-weight:700; margin-left:4px; }
.sent-line{ font-size:21px; min-height:40px; margin:10px 0; padding:6px 10px; border-bottom:2px dashed var(--field-line); }
.tok.ok{ color:var(--ok); font-weight:700; } .tok.cursor{ color:var(--lime); animation:blink 1s infinite; }
@keyframes blink{ 50%{ opacity:.2; } }
.sheet.terminal{ background:#050c0a; border-color:rgba(166,255,77,.4); box-shadow:0 0 40px rgba(166,255,77,.12), 0 30px 80px rgba(0,0,0,.6); }
.term-head{ font-family:var(--display); color:var(--lime); letter-spacing:.08em; font-size:14px; border-bottom:1px solid rgba(166,255,77,.3); padding-bottom:8px; margin-bottom:10px; }
.locks{ display:flex; gap:4px; font-size:18px; } .locks .open{ filter:drop-shadow(0 0 6px var(--lime)); }
.card-lines{ list-style:none; padding:0; margin:0; display:grid; gap:6px; } .card-lines li{ background:var(--field); border-radius:10px; padding:7px 12px; border-left:3px solid var(--cyan); } .card-lines .de{ font-weight:700; }
.terms{ display:flex; flex-wrap:wrap; gap:6px; }
.term{ display:flex; flex-direction:column; align-items:flex-start; border:1px solid var(--line); background:var(--chip); border-radius:10px; padding:4px 10px; cursor:pointer; font-weight:700; font-size:15px; color:var(--txt); }
.term small{ font-weight:400; color:#e0c98f; font-style:italic; font-size:12px; }
.term.art-der{ border-left:4px solid var(--der); } .term.art-die{ border-left:4px solid var(--die); } .term.art-das{ border-left:4px solid var(--das); }
.path{ font-size:18px; background:var(--field); border-radius:10px; padding:7px 12px; }
.tabs{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.tab{ border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:4px 12px; cursor:pointer; color:var(--txt); font-size:14px; }
.tab.on{ background:var(--cyan); color:#032530; border-color:var(--cyan); font-weight:700; }
.tabs input{ margin-left:auto; font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--field); color:var(--txt); width:240px; max-width:100%; }
.lgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; }
.lcard{ position:relative; text-align:left; display:flex; flex-direction:column; gap:1px; background:var(--chip); border:1px solid var(--line); border-left-width:5px; border-radius:12px; padding:8px 10px; cursor:pointer; color:var(--txt); font-size:16px; }
.lcard.art-der{ border-left-color:var(--der); } .lcard.art-die{ border-left-color:var(--die); } .lcard.art-das{ border-left-color:var(--das); }
.lcard b{ padding-right:22px; overflow-wrap:anywhere; } .lcard small{ color:var(--muted); font-size:12px; } .lcard .es{ font-size:13px; }
.lcard .tier{ position:absolute; right:7px; top:5px; font-size:15px; } .lcard.t0{ opacity:.55; } .lcard.t3{ box-shadow:0 0 0 1px var(--amber), 0 0 16px rgba(255,200,61,.2); }
.shop-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; }

.shop-item.on{ border-color:var(--lime); box-shadow:0 0 0 1px var(--lime); }
.swatch{ width:44px; height:44px; border-radius:10px; border:2px solid rgba(255,255,255,.3); }
.badges{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.badge{ display:flex; flex-direction:column; align-items:center; text-align:center; background:var(--chip); border-radius:12px; padding:8px; opacity:.4; filter:grayscale(1); }
.badge.on{ opacity:1; filter:none; border:1px solid var(--amber); } .badge .bi{ font-size:28px; } .badge small{ color:var(--muted); }
.set-row{ display:flex; gap:10px; align-items:center; margin:8px 0; font-size:16px; } .set-row input[type=checkbox]{ width:20px; height:20px; accent-color:var(--amber); } .set-row input[type=range]{ accent-color:var(--amber); }
.name-row{ display:inline-flex; gap:8px; align-items:center; margin:14px 0 4px; font-weight:700; }
.name-row input, .set-row input[type=text]{ font:inherit; font-size:17px; padding:6px 10px; border:1px solid var(--field-line); border-radius:10px; background:var(--field); color:var(--txt); width:190px; }
.res-table{ border-collapse:collapse; width:100%; margin:6px 0; font-size:15px; }
.res-table td, .res-table th{ padding:5px 8px; border-bottom:1px solid rgba(125,170,255,.14); text-align:left; }
.res-table .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.pbar{ height:10px; background:#1c2742; border-radius:5px; overflow:hidden; min-width:140px; } .pbar i{ display:block; height:100%; background:var(--cyan); }
textarea{ font:inherit; font-size:17px; width:100%; box-sizing:border-box; border:1px solid var(--field-line); border-radius:10px; padding:6px 10px; background:var(--field); color:var(--txt); resize:vertical; }
#pa-io textarea{ font-family:ui-monospace, monospace; font-size:12px; }
.controls{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:15px; text-align:left; max-width:420px; margin:10px auto; }
.controls kbd{ justify-self:end; }

<script>
'use strict';
/* ============================================================
   CONTENT — everything the game teaches comes from gz-biologia.pdf
   ============================================================ */
const TOPICS = { aussen:'Äußerer Körperbau', skelett:'Das Skelett', organe:'Die Organe', schnabel:'Die Schnäbel', merkmale:'Die Merkmale', op:'Aufgaben-Wörter' };
const TOPICS_ES = { aussen:'Cuerpo por fuera', skelett:'El esqueleto', organe:'Los órganos', schnabel:'Los picos', merkmale:'Las características', op:'Palabras de los ejercicios' };

const WORDS = [];
function slug(s){ return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
// N = noun: article, word, plural ('*' = only plural, null = no plural), Spanish, topic, German definition, example, Spanish tip, extra accepted answers
function N(art,de,pl,es,t,def,ex,tip,alt){ WORDS.push({ id:slug(de), art, de, pl: pl==='*'?null:pl, po: pl==='*', es, t, def, ex, tip, alt }); }
// V = verb / adjective / expression (no article)
function V(de,es,t,def,ex,tip){ WORDS.push({ id:slug(de), art:null, de, pl:null, es, t, def, ex, tip }); }

/* ---- Seite 2: der äußere Körperbau ---- */
N('der','Vogel','Vögel','el pájaro / el ave','aussen','Ein Wirbeltier mit Federn, Flügeln und Schnabel.','Alle Vögel haben einen gemeinsamen Körperbau.');
N('die','Vogelart','Vogelarten','la especie de ave','aussen','Eine Gruppe von gleichen Vögeln, z. B. die Amsel.','Es gibt viele verschiedene Vogelarten.');
N('der','Greifvogel','Greifvögel','el ave rapaz','aussen','Ein großer Vogel, der Tiere mit seinen Krallen greift.','Der Adler und der Falke sind Greifvögel.','greifen = agarrar → el pájaro que agarra a sus presas.');
N('der','Singvogel','Singvögel','el pájaro cantor','aussen','Ein kleiner Vogel, der singt.','Die Amsel und der Haussperling sind Singvögel.','singen = cantar');
N('der','Wasservogel','Wasservögel','el ave acuática','aussen','Ein Vogel, der am oder im Wasser lebt.','Der Pelikan ist ein Wasservogel.');
N('der','Adler','Adler','el águila','aussen',null,'Der Adler ist ein großer Greifvogel.','¡Ojo! der Adler es masculino, pero en español decimos LA águila.');
N('der','Falke','Falken','el halcón','aussen',null,'Der Falke ist ein Greifvogel.');
N('die','Amsel','Amseln','el mirlo','aussen',null,'Die Amsel ist ein Singvogel.','¡Ojo! die Amsel es femenino, pero EL mirlo.');
N('der','Haussperling','Haussperlinge','el gorrión común','aussen',null,'Der Haussperling ist ein kleiner Singvogel.','Haus (casa) + Sperling (gorrión)');
N('der','Pelikan','Pelikane','el pelícano','aussen',null,'Der Pelikan ist ein Wasservogel.');
N('der','Körperbau',null,'la estructura del cuerpo','aussen','Wie der Körper aufgebaut ist.','Alle Vögel haben einen gemeinsamen Körperbau.','Körper (cuerpo) + Bau (construcción)');
N('der','Körper','Körper','el cuerpo','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.');
N('der','Kopf','Köpfe','la cabeza','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.','¡Ojo! der Kopf es masculino, pero LA cabeza.');
N('der','Rumpf','Rümpfe','el tronco (del cuerpo)','aussen','Der mittlere Teil des Körpers, ohne Kopf, Flügel und Beine.','Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.');
N('der','Schwanz','Schwänze','la cola','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.','¡Ojo! der Schwanz, pero LA cola.');
N('der','Schnabel','Schnäbel','el pico','aussen','Der harte Mund des Vogels. Vögel haben keine Zähne.','Alle Vögel besitzen einen Schnabel.');
N('die','Brust',null,'el pecho / la pechuga','aussen','Der vordere Teil des Rumpfes, unter dem Kopf.','Die Brust ist vorne am Rumpf.');
N('der','Bauch','Bäuche','el vientre / la barriga','aussen','Der untere Teil des Rumpfes.','Der Bauch ist unten am Rumpf.');
N('das','Bein','Beine','la pata / la pierna','aussen',null,'Die Haut an den Beinen ist mit Schuppen bedeckt.','das Bein es neutro — igual que das Brustbein.');
N('die','Kralle','Krallen','la garra','aussen','Der spitze, harte Nagel an den Zehen.','Die Hintergliedmaßen besitzen Krallen zum Laufen, Klettern, Greifen oder Schwimmen.',null,['die Krallen']);
N('der','Flügel','Flügel','el ala','aussen','Der Körperteil zum Fliegen.','Die Vordergliedmaßen sind zu Flügeln umgebildet.','Se escribe Flügel (con L al final), no «Flügen». El plural es igual: die Flügel. ¡Y es DER Flügel, pero EL ala!',['die Flügel']);
N('die','Gliedmaßen','*','las extremidades','aussen','Arme und Beine. Beim Vogel: Flügel und Beine.','Die Vordergliedmaßen sind zu Flügeln umgebildet.','Solo existe en plural: die Gliedmaßen.');
N('die','Vordergliedmaßen','*','las extremidades anteriores','aussen','Die vorderen Gliedmaßen. Beim Vogel sind das die Flügel.','Die Vordergliedmaßen sind zu Flügeln umgebildet.','vorne = delante → las extremidades de delante = las alas.');
N('die','Hintergliedmaßen','*','las extremidades posteriores','aussen','Die hinteren Gliedmaßen. Beim Vogel sind das die Beine.','Die Hintergliedmaßen besitzen Krallen.','hinten = detrás → las extremidades de atrás = las patas.');
N('die','Feder','Federn','la pluma','aussen',null,'Die Federn bedecken den ganzen Körper.');
V('fliegen','volar','aussen',null,'Die Flügel dienen dem Fliegen.');
V('laufen','andar / correr','aussen',null,'Mit den Krallen kann der Vogel laufen.');
V('klettern','trepar','aussen',null,'Mit den Krallen kann der Vogel klettern.');
V('greifen','agarrar','aussen',null,'Greifvögel greifen Tiere mit den Krallen.');
V('schwimmen','nadar','aussen',null,'Wasservögel können schwimmen.');
V('gegliedert','dividido (en partes)','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.');
V('umgebildet','transformado','aussen',null,'Die Vordergliedmaßen sind zu Flügeln umgebildet.');

/* ---- Seite 3: das Skelett ---- */
N('das','Wirbeltier','Wirbeltiere','el vertebrado','skelett','Ein Tier mit einer Wirbelsäule.','Die Vögel sind Wirbeltiere, die fliegen können.','Wirbel (vértebra) + Tier (animal). das Tier → das Wirbeltier.');
N('das','Skelett','Skelette','el esqueleto','skelett','Alle Knochen eines Körpers zusammen.','Vögel haben ein Skelett aus sehr leichten Knochen.');
N('der','Knochen','Knochen','el hueso','skelett',null,'Das Skelett besteht aus sehr leichten Knochen.');
N('der','Schädel','Schädel','el cráneo','skelett','Die Knochen des Kopfes.','Wie alle Wirbeltiere besitzen Vögel einen Schädel.');
N('die','Wirbelsäule','Wirbelsäulen','la columna vertebral','skelett','Die Kette aus Wirbeln im Rücken.','Vögel besitzen eine Wirbelsäule mit den Rippen.','die Säule = la columna → die Wirbelsäule.');
N('der','Wirbel','Wirbel','la vértebra','skelett',null,'Die Wirbelsäule besteht aus vielen Wirbeln.');
N('die','Rippe','Rippen','la costilla','skelett',null,'Die Wirbelsäule hat Rippen.',null,['die Rippen']);
N('die','Schwanzwirbelsäule','Schwanzwirbelsäulen','las vértebras de la cola','skelett','Der hintere Teil der Wirbelsäule.','Die Schwanzwirbelsäule ist viel kürzer als bei den Reptilien.','Es DIE Schwanzwirbelsäule: en alemán la ÚLTIMA palabra decide el artículo → die Säule.');
N('das','Reptil','Reptilien','el reptil','skelett',null,'Die Schwanzwirbelsäule ist kürzer als bei den Reptilien.');
N('der','Oberarm','Oberarme','el brazo (hueso: el húmero)','skelett','Der obere Knochen im Flügel, nah am Körper.','Die Flügel bestehen aus dem Oberarm, dem Unterarm und der Hand.','ober = de arriba');
N('der','Unterarm','Unterarme','el antebrazo','skelett','Der Teil des Flügels zwischen Oberarm und Hand. Er hat zwei Knochen.','Am Unterarm können wir zwei Knochen unterscheiden.','unter = de abajo');
N('die','Hand','Hände','la mano','skelett',null,'Die Flügel bestehen aus dem Oberarm, dem Unterarm und der Hand.');
N('der','Handknochen','Handknochen','los huesos de la mano','skelett','Die Knochen an der Spitze des Flügels.','Die Handknochen bilden die Spitze des Flügels.',null,['die Handknochen']);
N('die','Elle','Ellen','el cúbito','skelett','Einer der zwei Knochen im Unterarm.','Am Unterarm unterscheiden wir die Elle und die Speiche.');
N('die','Speiche','Speichen','el radio (hueso)','skelett','Einer der zwei Knochen im Unterarm.','Am Unterarm unterscheiden wir die Elle und die Speiche.','die Speiche también es el «rayo» de una rueda de bici.');
N('das','Becken','Becken','la pelvis','skelett','Der Knochen, der die Beine mit der Wirbelsäule verbindet.','Die hinteren Gliedmaßen sind durch das Becken mit der Wirbelsäule verbunden.','das Becken también significa «la pileta / el lavabo».');
N('der','Oberschenkel','Oberschenkel','el muslo (hueso: el fémur)','skelett','Der obere Knochen im Bein.','Die hinteren Gliedmaßen bestehen aus dem Oberschenkel, dem Unterschenkel und den Zehen.');
N('der','Unterschenkel','Unterschenkel','la pierna (parte de abajo; hueso: la tibia)','skelett','Der untere Teil des Beins.','Die Beine bestehen aus Oberschenkel, Unterschenkel und Zehen.');
N('die','Zehe','Zehen','el dedo del pie','skelett',null,'An den Zehen befinden sich Krallen.',null,['die Zehen']);
N('das','Brustbein','Brustbeine','el esternón','skelett','Der große Knochen vorne an der Brust. Dort sitzen die Flugmuskeln.','Am Brustbein befinden sich die Muskeln, die die Flügel bewegen.','Brust (pecho) + Bein (antiguamente: hueso) → das Brustbein. ¡No «Bruntbein»!');
N('der','Muskel','Muskeln','el músculo','skelett',null,'Am Brustbein befinden sich die Muskeln, die die Flügel bewegen.');
N('der','Röhrenknochen','Röhrenknochen','el hueso hueco (en forma de tubo)','skelett','Ein hohler Knochen mit Luft innen. Er ist sehr leicht.','Vögel haben hohle Röhrenknochen.','die Röhre = el tubo');
V('leicht','ligero / liviano','skelett',null,'Das Skelett besteht aus sehr leichten Knochen.');
V('hohl','hueco','skelett',null,'Vögel haben hohle Röhrenknochen.');
V('kürzer','más corto','skelett',null,'Die Schwanzwirbelsäule ist viel kürzer als bei den Reptilien.');

/* ---- Seite 4: die Organe ---- */
N('das','Organ','Organe','el órgano','organe',null,'Bei den Organen gibt es Unterschiede zu anderen Wirbeltieren.');
N('die','Lunge','Lungen','el pulmón','organe','Das Organ zum Atmen.','Die Lunge eines Vogels hat mehrere Luftsäcke.','¡Ojo! die Lunge, pero EL pulmón.');
N('der','Luftsack','Luftsäcke','el saco aéreo','organe','Ein Sack voll Luft an der Lunge. So bekommt der Vogel mehr Sauerstoff.','Die Lunge eines Vogels besitzt mehrere Luftsäcke.','Singular: der Luftsack. Plural: die Luftsäcke. «Luft» va SIN diéresis (no «Lüftsäcke»).',['die Luftsäcke']);
N('der','Sauerstoff',null,'el oxígeno','organe','Ein Gas in der Luft. Tiere brauchen es zum Leben.','Mit den Luftsäcken kann ein Vogel besser den Sauerstoff aus der Luft aufnehmen.');
N('die','Luft',null,'el aire','organe',null,'Die Luftröhre transportiert die Luft zur Lunge.');
N('die','Luftröhre','Luftröhren','la tráquea','organe','Das Rohr, das die Luft von außen zur Lunge bringt.','Die Luftröhre transportiert die Luft von außen zur Lunge.','Luft (aire) + Röhre (tubo) = el tubo del aire.');
N('der','Zahn','Zähne','el diente','organe',null,'Vögel haben keine Zähne.',null,['die Zähne']);
N('die','Nahrung',null,'el alimento / la comida','organe','Das, was ein Tier frisst.','Vögel müssen ihre Nahrung in den Verdauungsorganen zerkleinern.');
N('die','Verdauungsorgane','*','los órganos digestivos','organe','Die Organe, in denen die Nahrung verarbeitet wird.','Vögel zerkleinern ihre Nahrung in den Verdauungsorganen.','verdauen = digerir');
N('der','Kropf','Kröpfe','el buche','organe','Eine Erweiterung am Hals. Hier kommt die Nahrung zuerst hin und wird weich.','Die Nahrung kommt zunächst in den Kropf.','¡Ojo! der Kropf = EL buche. Es la PRIMERA parada de la comida.');
N('der','Drüsenmagen','Drüsenmägen','el proventrículo (estómago glandular)','organe','Der erste Teil des Magens. Hier kommen Verdauungssäfte dazu.','Aus dem Kropf kommt die Nahrung in den Drüsenmagen.','die Drüse = la glándula. Segunda parada.');
N('der','Kaumagen','Kaumägen','la molleja','organe','Ein starker Muskelmagen. Er zerkleinert die Nahrung, weil Vögel keine Zähne haben.','Danach kommt die Nahrung in den Kaumagen.','kauen = masticar → el estómago que «mastica». Tercera parada.');

  p4: { title:'Die Organe des Vogels', src:'Seite 4', parts:[
    'Die [[Lunge]] eines Vogels besitzt mehrere [[Luftsäcke]]. Mit diesen Luftsäcken kann ein Vogel besser den [[Sauerstoff]] aus der Luft aufnehmen. Die [[Luftröhre]] transportiert die Luft von außen zur Lunge.',
    'Weil die Vögel keine [[Zähne]] haben, müssen sie ihre [[Nahrung]] in den Verdauungsorganen [[zerkleinern]]. Die Nahrung kommt zuerst in den [[Kropf]], dann in den [[Drüsenmagen]], danach in den [[Kaumagen]] und schließlich in den [[Darm]].',
    'Die Vögel besitzen wie die Reptilien eine [[Kloake]]. Der [[Urin]] aus der [[Niere]], der [[Kot]] und die [[Spermazellen]] des [[Männchens|maennchen]] verlassen durch die Kloake den Körper.',
  ]},
  p6: { title:'Der Schnabel verrät, was ein Vogel frisst', src:'Seite 6–7', parts:[
    'Der Schnabel besteht aus [[Knochen]]. Er trägt eine [[Hülle]] aus hartem [[Horn]], die ständig [[nachwächst|nachwachsen]]. Durch Gebrauch wird sie [[abgenutzt|abnutzen]]. Der Schnabel ist viel [[beweglicher|beweglich]] und [[empfindlicher|empfindlich]], als die meisten denken.',
    'Die [[Uferschnepfe]] [[stochert|stochern]] mit ihrem langen Schnabel im feuchten [[Schlamm]] nach [[Würmern|wurm]]. Ihr feiner [[Tastsinn]] verrät ihr, wann sie zupacken muss. Schnäbel sind wie [[Werkzeuge]]: Manche gleichen langen [[Pinzetten]], andere kräftigen [[Meißeln|meissel]], wieder andere starken [[Zangen]].',
  ]},
  p8: { title:'Die Merkmale der Vögel', src:'Seite 8', parts:[
    'Vögel gehören zu den [[Wirbeltieren|wirbeltier]]. Alle Vögel haben [[Flügel]] und ein [[Federkleid]], welches ihren ganzen Körper bedeckt. Außerdem haben sie einen [[Schnabel]], jedoch keine echten [[Zähne]]. Alle Vögel legen [[Eier]] und besitzen eine [[Kloake]], aus welcher Eier, Kot und Urin ausgeführt werden.',
    'Die Haut an den Beinen ist mit [[Schuppen]] bedeckt und an den Zehen befinden sich [[Krallen]]. Zusätzlich zur Lunge haben Vögel [[Luftsäcke]] und hohle [[Röhrenknochen]]. Die Körpertemperatur liegt zwischen 38 °C und 42 °C und bleibt immer gleich. Daher sind Vögel, so wie auch [[Säugetiere]], [[gleichwarme|gleichwarm]] Wirbeltiere.',
    'Fast alle Vögel können fliegen. Der [[Strauß]], der [[Emu]], der [[Pinguin]] und der [[Kiwi]] sind [[flugunfähige|flugunfaehig]] Vögel. Das liegt vor allem daran, dass sie zu [[schwer]] sind.',
  ]},
};

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function sample(a, n){ return shuffle(a.slice()).slice(0, n); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function stripTags(s){ return String(s).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim(); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- spaced repetition (Leitner, 5 boxes) ---------- */
const BOX_MS = [0, 0, 5 * 60e3, 30 * 60e3, 4 * 3600e3, 20 * 3600e3];
function ws(id){ return S.words[id] || (S.words[id] = { b:0, d:0, r:0, w:0 }); }
function tier(id){ const w = S.words[id]; if (!w || w.b === 0) return 0; if (w.b <= 2) return 1; if (w.b <= 4) return 2; return 3; }
const TIER_NAME = ['neu', 'Bronze', 'Silber', 'Gold'];
function grade(id, result){
  const w = WMAP[id]; if (!w) return;
  const s = ws(id), now = Date.now();
  const ts = S.stats.topic[w.t] || (S.stats.topic[w.t] = { r:0, w:0 });
  if (result === 'right'){ s.r++; ts.r++; if (s.b === 0) s.b = 1; if (now >= s.d || s.b <= 1) s.b = Math.min(5, s.b + 1); s.d = now + BOX_MS[s.b]; }
  else if (result === 'wrong'){ s.w++; ts.w++; s.b = 1; s.d = now; }
  else { s.r++; if (s.b === 0) s.b = 1; s.d = now + 60e3; }
  if (Object.values(S.words).filter(x => x.b >= 5).length >= 20) badge('gold20');
  save();
}
function pickWords(ids, n){
  const now = Date.now();
  return ids.map(id => {
    const s = S.words[id]; let sc;
    if (!s || s.b === 0) sc = 5 + Math.random() * 2;
    else if (s.d <= now) sc = 10 - s.b + Math.random() * 1.5 + (s.w > s.r ? 1 : 0);
    else sc = Math.random() * 3 - s.b * 0.5;
    return [sc, id];
  }).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => x[1]);
}
function topicIds(t, filter){ return WORDS.filter(w => (t === 'all' || w.t === t) && (!filter || filter(w))).map(w => w.id); }
function unlockedTopics(){ const t = []; for (let z = 1; z <= 5; z++) if (z <= S.zone) t.push(ZONES[z].topic); if (S.zone >= 5) t.push('op'); return t; }
function dueCount(){ const now = Date.now(); const ts = unlockedTopics(); return WORDS.filter(w => ts.includes(w.t) && S.words[w.id] && S.words[w.id].b > 0 && S.words[w.id].d <= now).length; }

/* ---------- sound effects (Web Audio synth) ---------- */
let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, type = 'square', vol = 0.05, when = 0, slide = 0){
  if (!S.settings.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.08, freq = 1200){
  if (!S.settings.sound) return; const a = ac(); if (!a) return;
  const b = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

function hasVoice(text){ return !!VOICE[vnorm(text)] || !!deVoice; }
function speak(text){
  if (!S.settings.tts || !text) return;
  const k = vnorm(text);
  if (VOICE[k]){
    if (!voiceUrl[k]){ const bin = atob(VOICE[k]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); voiceUrl[k] = URL.createObjectURL(new Blob([u8], { type:'audio/mpeg' })); }
    try { if (curAudio){ curAudio.pause(); } if (HAS_TTS) speechSynthesis.cancel(); curAudio = new Audio(voiceUrl[k]); curAudio.play().catch(() => {}); } catch (e) {}
    return;
  }
  // Fallback: only with a real German voice, never with an English one reading German.
  if (!HAS_TTS || !deVoice) return;
  try { if (curAudio) curAudio.pause(); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = deVoice.lang; u.voice = deVoice; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
}
function speakBtn(text){ return `<button class="say" type="button" data-say="${esc(text)}" title="Anhören" aria-label="Anhören: ${esc(text)}">🔊</button>`; }

/* ---------- input ---------- */
const keys = {};
const keyStack = [];
function pushKeys(fn){ keyStack.push(fn); return () => { const i = keyStack.indexOf(fn); if (i >= 0) keyStack.splice(i, 1); }; }
function isField(el){ return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'); }
let gameKey = null; // set by the engine
addEventListener('keydown', e => {
  const typing = isField(e.target);
  if (!typing){ keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault(); }
  if (keyStack.length && modal.hidden && panel.hidden) keyStack.length = 0;
  const top = keyStack[keyStack.length - 1];
  if (top){ if (top(e, typing)) e.preventDefault(); return; }
  if (modalOpen()){ if (e.code === 'Escape' && modal.dataset.closable === '1') closeModal(); return; }
  if (typing) return;
  if (gameKey) gameKey(e);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function down(...codes){ return codes.some(c => keys[c]); }

/* ---------- rewards, levels, badges ---------- */
let combo = 0;
function mult(){ return 1 + Math.min(4, Math.floor(combo / 3)) * 0.5; }
function levelOf(xp){ let i = 0; for (let k = 0; k < LEVELS.length; k++) if (xp >= LEVELS[k][0]) i = k; return i; }
function addFeathers(n){
  const before = levelOf(S.xp);
  S.feathers += n; S.xp += n;
  const after = levelOf(S.xp);
  if (after > before){ SFX.lvl(); S.hearts = S.maxHearts; toast(`⬆️ <b>Level ${after + 1}: ${LEVELS[after][1]}</b> — Herzen voll!`, 'gold'); }
  hud(); save();
}
function badge(k){ if (S.badges[k]) return; S.badges[k] = Date.now(); const b = BADGES[k]; SFX.win(); toast(`${b.i} Abzeichen: <b>${b.n}</b>`, 'gold'); save(); }
function onAnswer(result, q){
  if (q && q.id) grade(q.id, result);
  if (result === 'right'){
    combo++; if (combo > S.bestCombo) S.bestCombo = combo; if (combo >= 10) badge('combo10');
    if (q && q.type === 'art'){ S.artRight++; if (S.artRight >= 30) badge('art30'); }
    addFeathers(Math.round(5 * mult()));
  } else if (result === 'wrong'){ combo = 0; }
  hud();
}
function hurt(n = 1){
  S.hearts = Math.max(0, S.hearts - n); combo = 0; SFX.hit(); hud(); save();
  const f = $('#hurt'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}

/* ---------- HUD ---------- */
function hud(){
  const L = levelOf(S.xp), next = LEVELS[L + 1];
  const pct = next ? (S.xp - LEVELS[L][0]) / (next[0] - LEVELS[L][0]) * 100 : 100;
  let hearts = '';
  for (let i = 0; i < S.maxHearts; i++) hearts += `<span class="${i < S.hearts ? '' : 'empty'}">♥</span>`;
  $('#h-hearts').innerHTML = hearts;
  $('#h-feathers').textContent = S.feathers;
  $('#h-level').textContent = `LV ${L + 1}`;
  $('#h-title').textContent = LEVELS[L][1];
  $('#h-xp').style.width = pct + '%';
  const c = $('#h-combo');
  if (combo >= 3){ c.hidden = false; c.textContent = `🔥 ${combo}  x${mult()}`; } else c.hidden = true;
  $('#b-sound').textContent = S.settings.sound ? '🔊' : '🔇';
  $('#b-tts').classList.toggle('off', !S.settings.tts);
}
/* ============================================================
   QUIZ — question generation, answer checking, question UI
   ============================================================ */
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fold(s){ return s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); }
function normT(s){ return s.replace(/[.,!?;:„“"'»«()]/g, ' ').replace(/\s+/g, ' ').trim(); }
function parseArt(s){ const m = s.match(/^(der|die|das)\s+(.+)$/i); return m ? { art:m[1].toLowerCase(), rest:m[2] } : { art:null, rest:s }; }
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length:n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function checkTyped(input, accepts){
  const inp = normT(input || '');
  if (!inp) return { res:'wrong', score:0, msg:'Keine Antwort.', target:accepts[0] };
  const pi = parseArt(inp);
  let best = null;
  for (const a of accepts){
    const pa = parseArt(normT(a));
    const needArt = !!pa.art;
    const exact = pi.rest === pa.rest, ci = pi.rest.toLowerCase() === pa.rest.toLowerCase(), fo = fold(pi.rest) === fold(pa.rest);
    const dist = lev(fold(pi.rest), fold(pa.rest));
    const close = pa.rest.length > 3 && dist <= (pa.rest.length > 8 ? 2 : 1);
    const artOk = !needArt || pi.art === pa.art;
    let res, score, msg = '';
    if ((exact || ci) && artOk){ res = 'right'; score = 5; if (!exact) msg = /^[A-ZÄÖÜ]/.test(pa.rest) ? 'Tipp: Nomen schreibt man groß!' : 'Tipp: Dieses Wort schreibt man klein.'; }
    else if (fo && artOk){ res = 'right'; score = 4; msg = 'Achte auf die Umlaute: ä, ö, ü, ß.'; }
    else if ((ci || fo) && !artOk){ res = 'wrong'; score = 3; msg = pi.art ? `Richtiges Wort, aber falscher Artikel! Es heißt <b class="${artClass(pa.art)}">${pa.art}</b>.` : `Der Artikel fehlt! Es heißt <b class="${artClass(pa.art)}">${pa.art} ${esc(pa.rest)}</b>.`; }
    else if (close && artOk){ res = 'close'; score = 2; msg = 'Fast! Nur ein kleiner Schreibfehler.'; }
    else if (close){ res = 'wrong'; score = 1; msg = 'Schreibfehler und falscher Artikel.'; }
    else { res = 'wrong'; score = 0; }
    if (!best || score > best.score) best = { res, score, msg, target:a, artOk, near: ci || fo || close };
  }
  return best;
}
function typedPoints(r){ return r.res === 'right' ? 1 : r.res === 'close' ? 0.75 : r.score === 3 ? 0.5 : r.score === 1 ? 0.25 : 0; }

/* ---------- helpers for words ---------- */
function wordExplain(w){ return `${wordHTML(w, true)} = <i>${esc(w.es)}</i>` + (w.ex ? `<div class="ex">„${esc(w.ex)}“ ${speakBtn(w.ex)}</div>` : ''); }
function wordTip(w){ return w.tip ? '💡 ' + esc(w.tip) : ''; }
function distractors(w, n){
  const cls = x => !!x.art === !!w.art;
  const same = WORDS.filter(x => x.id !== w.id && cls(x) && x.t === w.t && x.es !== w.es && x.de !== w.de);
  let d = sample(same, n);
  if (d.length < n) d = d.concat(sample(WORDS.filter(x => x.id !== w.id && cls(x) && x.t !== w.t && !d.includes(x)), n - d.length));
  return d;
}
function exForm(w){
  if (!w.ex) return null;
  for (const f of [w.de, w.pl].filter(Boolean)){
    const re = new RegExp('(^|[^A-Za-zÄÖÜäöüß])(' + escRe(f) + ')(?=$|[^A-Za-zÄÖÜäöüß])');
    if (re.test(w.ex)) return { form:f, isPl: f === w.pl && f !== w.de, blank: w.ex.replace(re, (all, pre) => pre + '<span class="blank">_____</span>') };
  }
  return null;
}
function mcWords(w, ds, htmlFn){ return shuffle([w, ...ds]).map(x => ({ html:htmlFn(x), val:x.id })); }

const MAKERS = {
  es2de(w){ return { type:'mc', id:w.id, prompt:`Wie heißt das auf Deutsch?<div class="big-es">${esc(w.es)}</div>`, options:mcWords(w, distractors(w, 3), x => wordHTML(x)), correct:w.id,
    answerHTML:wordHTML(w), explain:wordExplain(w), explainEs:wordTip(w), es:`¿Cómo se dice en alemán «${esc(w.es)}»?`, sayAfter:nounLabel(w) }; },

    answerHTML:esc(w.es), explain:wordExplain(w), explainEs:wordTip(w), es:`¿Qué significa «${esc(nounLabel(w))}»? Elige la traducción.`, sayAfter:nounLabel(w) }; },
  art(w){ return { type:'art', id:w.id, prompt:`Welcher Artikel?<div class="big">${esc(w.de)}${w.po ? ' <small>(Plural)</small>' : ''}</div>`,
    options:['der', 'die', 'das'].map((a, i) => ({ html:a, val:a, key:'JKL'[i], cls:'art-btn ' + artClass(a) })), correct:w.art,
    answerHTML:wordHTML(w), explain:wordExplain(w), explainEs:wordTip(w), es:`¿Qué artículo lleva? (${esc(w.es)}) — der = masculino, die = femenino o plural, das = neutro.`, sayAfter:nounLabel(w) }; },
  def(w){ return { type:'mc', id:w.id, prompt:`Welches Wort passt?<div class="def">„${esc(w.def)}“</div>`, options:mcWords(w, distractors(w, 3), x => wordHTML(x)), correct:w.id,
    answerHTML:wordHTML(w), explain:wordExplain(w), explainEs:wordTip(w), es:`¿Qué palabra corresponde a la definición? Pista: significa «${esc(w.es)}».`, sayAfter:nounLabel(w) }; },

  },
  audio(w){ return { type:'mc', id:w.id, prompt:`Hör genau zu! Welches Wort hörst du? ${speakBtn(nounLabel(w))}`, say:nounLabel(w), options:mcWords(w, distractors(w, 3), x => wordHTML(x)), correct:w.id,
    answerHTML:wordHTML(w), explain:wordExplain(w), explainEs:wordTip(w), es:'Escucha (🔊) y elige la palabra que oyes.' }; },
  type(w){ return { type:'type', id:w.id, prompt:`Schreib auf Deutsch${w.art ? ' – <b>mit Artikel</b>' : ''}:<div class="big-es">${esc(w.es)}</div>`, accept:[nounLabel(w), ...(w.alt || [])],

  dictation(w){ return { type:'type', id:w.id, prompt:`Hör zu und schreib das Wort${w.art ? ' <b>mit Artikel</b>' : ''}! ${speakBtn(nounLabel(w))}<div class="muted">(${esc(w.es)})</div>`, say:nounLabel(w), accept:[nounLabel(w), ...(w.alt || [])],
    answerHTML:wordHTML(w), explain:wordExplain(w), explainEs:wordTip(w), es:'Escucha (🔊) y escribe la palabra que oyes.', sayAfter:nounLabel(w), placeholder: w.art ? 'der / die / das + Wort' : 'Wort' }; },
};
function qFromWord(id, kinds){
  const w = WMAP[id];
  const valid = (kinds || ['es2de', 'de2es', 'art', 'def', 'ex', 'audio']).filter(k => {

/* ---------- ask one question ---------- */
let qUid = 0;
function askQ(q, mount, o = {}){
  return new Promise(resolve => {
    const uid = ++qUid, t0 = performance.now();
    let done = false, usedHelp = false, timer = null, autoT = null;
    const helpOn = q.es && !o.noHelp;
    let h = `<div class="q ${o.compact ? 'compact' : ''}"><div class="q-head"><div class="q-prompt">${q.prompt}</div>`;
    if (helpOn) h += `<button class="btn tiny help" type="button">🇪🇸 Ayuda</button>`;
    h += `</div>`;
    if (helpOn) h += `<div class="q-help" ${S.settings.es ? '' : 'hidden'}>${q.es}</div>`;
    h += `<div class="q-body">${q.media ? `<div class="q-media">${q.media}</div>` : ''}<div class="q-main">`;
    if (q.type === 'type') h += `<div class="typerow"><input class="answer" id="ans-${uid}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.placeholder || '')}" aria-label="Antwort"><button class="btn go" type="button">Prüfen ⏎</button></div>${umlautBar()}`;
    else h += `<div class="opts ${q.type}">` + q.options.map((op, i) => `<button class="opt ${op.cls || ''}" type="button" data-i="${i}"><kbd>${op.key || i + 1}</kbd><span>${op.html}</span></button>`).join('') + `</div>`;
    h += `</div></div>`;
    if (o.timeLimit) h += `<div class="timer"><i></i></div>`;
    h += `<div class="fb" hidden></div></div>`;
    mount.innerHTML = h;
    const root = mount.querySelector('.q');
    if (q.say) setTimeout(() => speak(q.say), 250);
    const helpBtn = root.querySelector('.help');
    if (helpBtn) helpBtn.onclick = () => { usedHelp = true; root.querySelector('.q-help').hidden = false; helpBtn.disabled = true; };
    const input = root.querySelector('input.answer');

      if (msg && !timeout) f += `<div class="fb-msg">${msg}</div>`;

/* ---------- a series of questions in the modal ---------- */
async function runSeries(title, qs, o = {}){
  let correct = 0;
  openModal(`<div class="series"><div class="series-head"><h2>${title}</h2><div class="prog" id="s-prog"></div></div>${o.sub ? `<p class="sub">${o.sub}</p>` : ''}<div id="qmount"></div></div>`, o.cls || '');
  for (let i = 0; i < qs.length; i++){

  if (P.jumpBuf > 0 && P.coyote > 0){ P.vel.y = 12.2; P.coyote = 0; P.jumpBuf = 0; P.grounded = false; SFX.jump(); }
  P.vel.y -= 32 * dt; if (P.vel.y < -40) P.vel.y = -40;
  // moving platform carry
  if (P.grounded && P.ground && P.ground.dv){ P.pos.add(P.ground.dv); }
  // integrate + collide, axis by axis
  const cols = activeCols;
  const moveAxis = (ax) => {
    const d = P.vel[ax] * dt; if (!d) return;
    P.pos[ax] += d;
    for (const c of cols){
      if (!overlaps(c, P.pos.x, P.pos.y, P.pos.z)) continue;
      // step up small ledges
      if (P.grounded && c.max.y - P.pos.y <= 0.55 && !cols.some(o => o !== c && overlaps(o, P.pos.x, c.max.y + 0.01, P.pos.z))){ P.pos.y = c.max.y + 0.001; continue; }
      if (ax === 'x') P.pos.x = d > 0 ? c.min.x - P.hx - 0.001 : c.max.x + P.hx + 0.001;
      else P.pos.z = d > 0 ? c.min.z - P.hx - 0.001 : c.max.z + P.hx + 0.001;
      P.vel[ax] = 0;
    }
  };
  moveAxis('x'); moveAxis('z');
  const wasGround = P.grounded; P.grounded = false;
  P.pos.y += P.vel.y * dt;
  for (const c of cols){
    if (!overlaps(c, P.pos.x, P.pos.y, P.pos.z)) continue;
    if (P.vel.y <= 0){ P.pos.y = c.max.y; P.vel.y = 0; P.grounded = true; P.ground = c; }
    else { P.pos.y = c.min.y - P.h - 0.001; P.vel.y = 0; }
  }
  if (!P.grounded){
    // small probe so that standing exactly on top counts as grounded
    for (const c of cols) if (c.active && Math.abs(P.pos.y - c.max.y) < 0.02 && P.pos.x + P.hx > c.min.x && P.pos.x - P.hx < c.max.x && P.pos.z + P.hx > c.min.z && P.pos.z - P.hx < c.max.z){ P.grounded = true; P.ground = c; }
  }
  if (P.grounded){ P.coyote = 0.1; if (!wasGround && P.vel.y <= 0){ SFX.land(); P.lastLand = performance.now(); } }
  else P.ground = null;
  if (P.inv > 0) P.inv -= dt;
  animateAvatar(dt, Math.hypot(P.vel.x, P.vel.z));
}
function animateAvatar(dt, sp){
  const av = P.av; if (!av) return;
  av.root.position.copy(P.pos);
  let d = P.face - av.root.rotation.y; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
  av.root.rotation.y += d * Math.min(1, dt * 14);
  P.phase += dt * (4 + sp * 0.9);
  const k = Math.min(1, sp / 9);
  const sw = P.grounded ? Math.sin(P.phase) * 0.9 * k : 0;
  av.legs[0].rotation.x = sw; av.legs[1].rotation.x = -sw;
  if (!P.grounded){ av.legs[0].rotation.x = 0.5; av.legs[1].rotation.x = -0.3; }
  av.arms[0].rotation.x = P.grounded ? -sw * 0.9 : -2.6;
  P.shootT = Math.max(0, P.shootT - dt);
  av.arms[1].rotation.x = P.shootT > 0 || aimMode() ? -1.5 : P.grounded ? sw * 0.9 : -2.6;
  av.tool.visible = aimMode() || P.shootT > 0;
  av.root.visible = !(P.inv > 0 && Math.floor(performance.now() / 90) % 2);
}

const cam = { yaw:0, pitch:0.26, dist:9.5, locked:false, dragging:false, dragMoved:0 };
function aimMode(){ return !!(activity && activity.shooting) || worldAim; }
let worldAim = false;
function cameraUpdate(dt){
  if (down('ArrowLeft')) cam.yaw += dt * 2.2; if (down('ArrowRight')) cam.yaw -= dt * 2.2;
  cam.pitch = clamp(cam.pitch, -0.35, 1.2);
  const tgt = new V3(P.pos.x, P.pos.y + 3.4, P.pos.z);
  const aim = aimMode();
  const dist = aim ? 6.5 : cam.dist;
  const off = new V3(Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch)).multiplyScalar(dist);
  if (aim){ off.x += Math.cos(cam.yaw) * 1.3; off.z += -Math.sin(cam.yaw) * 1.3; tgt.x += Math.cos(cam.yaw) * 1.3; tgt.z += -Math.sin(cam.yaw) * 1.3; }
  const want = tgt.clone().add(off);
  camera.position.lerp(want, Math.min(1, dt * 12));
  if (camera.position.distanceTo(want) > 12) camera.position.copy(want);
  camera.lookAt(tgt);
}
function demoCamera(t, cx = 0, cz = 0, r = 60, h = 34){

let shootables = [];
const ray = new THREE.Raycaster();
let ammo = 'der';
const AMMO_COL = { der:'#5b9dff', die:'#ff6b6b', das:'#3fdc8a' };
function registerShootable(obj, onHit, list = shootables){ const s = { obj, onHit }; obj.userData.shoot = s; list.push(s); return s; }
function shoot(){
  if (!S.started || modalOpen()) return;
  const canShoot = activity ? activity.shooting : true;
  if (!canShoot) return;
  P.shootT = 0.3; P.face = cam.yaw + Math.PI; SFX.shoot();
  ray.setFromCamera({ x:0, y:0 }, camera);
  const list = activity ? activity.shoot : shootables;
  const objs = list.filter(s => s.obj.visible !== false && s.obj.parent).map(s => s.obj);
  const hits = ray.intersectObjects(objs, true);
  const hand = new V3(); P.av.tip.getWorldPosition(hand);
  const col = activity && activity.tracerCol ? activity.tracerCol() : AMMO_COL[ammo];
  if (hits.length){
    let o = hits[0].object; while (o && !o.userData.shoot) o = o.parent;
    tracer(hand, hits[0].point, col);
    if (o) o.userData.shoot.onHit(hits[0].point);
  } else tracer(hand, ray.ray.at(90, new V3()), col);
}

/* ---------- fx: tracers, particles, orbs, popups ---------- */
const fx = [];
function tracer(a, b, color){
  const len = a.distanceTo(b); if (len < 0.1) return;
  const m = new THREE.Mesh(G('box', 0.09, 0.09, 1), new THREE.MeshBasicMaterial({ color:lin(color), transparent:true, opacity:0.95 }));
  m.scale.z = len; m.position.copy(a).add(b).multiplyScalar(0.5); m.lookAt(b); scene3.add(m);
  fx.push({ m, life:0.14, max:0.14, kind:'fade' });
  burst(b, color, 8, 5);
}
function burst(p, color, n = 18, spd = 9, size = 0.18){
  const mat = new THREE.MeshBasicMaterial({ color:lin(color), transparent:true });
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(G('box', size, size, size), mat); m.position.copy(p); scene3.add(m);
    const v = new V3(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5).normalize().multiplyScalar(spd * (0.4 + Math.random()));
    fx.push({ m, v, life:0.6 + Math.random() * 0.4, max:1, kind:'part', mat });
  }
}
function fxUpdate(dt){
  for (let i = fx.length - 1; i >= 0; i--){
    const f = fx[i]; f.life -= dt;
    if (f.kind === 'part'){ f.v.y -= 20 * dt; f.m.position.addScaledVector(f.v, dt); f.m.rotation.x += dt * 5; f.m.scale.setScalar(Math.max(0.01, f.life / f.max)); }
    else if (f.kind === 'fade') f.m.material.opacity = Math.max(0, f.life / f.max);
    if (f.life <= 0){ scene3.remove(f.m); if (f.kind === 'fade') f.m.material.dispose(); fx.splice(i, 1); }
  }
  orbsUpdate(dt);
  popupsUpdate(dt);
}
// enemy projectiles
const orbs = [];
function fireOrb(from, to, speed = 13, color = '#ff5d6c', size = 0.45){
  const m = mesh(G('sph', size, 10, 8), M(color, { em:color, emi:0.9 }), from.x, from.y, from.z, scene3, false);
  const v = to.clone().sub(from).normalize().multiplyScalar(speed);
  orbs.push({ m, v, life:6, r:size });
}
function orbsUpdate(dt){
  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i]; o.life -= dt; o.m.position.addScaledVector(o.v, dt);
    const p = o.m.position;
    const hit = p.x > P.pos.x - P.hx - o.r && p.x < P.pos.x + P.hx + o.r && p.z > P.pos.z - P.hx - o.r && p.z < P.pos.z + P.hx + o.r && p.y > P.pos.y - o.r && p.y < P.pos.y + P.h + o.r;
    if (hit && P.inv <= 0){ P.inv = 1.5; hurt(1); burst(p, '#ff5d6c', 14, 7); o.life = 0; if (activity && activity.onHurt) activity.onHurt(); }
    if (o.life <= 0){ scene3.remove(o.m); orbs.splice(i, 1); }
  }
}
function clearOrbs(){ orbs.forEach(o => scene3.remove(o.m)); orbs.length = 0; }
const popups = [];
function popText(pos, html, cls = ''){
  const d = document.createElement('div'); d.className = 'pop ' + cls; d.innerHTML = html; $('#popups').appendChild(d);
  popups.push({ d, p:pos.clone(), life:1.3 });

function popupsUpdate(dt){
  for (let i = popups.length - 1; i >= 0; i--){
    const q = popups[i]; q.life -= dt; q.p.y += dt * 1.6;

}

function swirlTexture(c1, c2){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.4, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 5;
  for (let k = 0; k < 4; k++){ g.beginPath(); for (let a = 0; a < 6; a += 0.1){ const r = a * 9; const x = 64 + Math.cos(a + k * Math.PI / 2) * r, y = 64 + Math.sin(a + k * Math.PI / 2) * r; a === 0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

function zoneAt(p){

function worldUpdate(dt){

  // drones

    S.pos = { x:P.pos.x, y:P.pos.y, z:P.pos.z }; save();

    world.arrow.rotation.set(0, Math.atan2(tg.x - P.pos.x, tg.z - P.pos.z), 0);
  } else world.arrow.visible = false;
  // nearest interactable
  let best = null, bd = 1e9;
  for (const it of world.inter){ const dd = Math.hypot(it.pos.x - P.pos.x, it.pos.z - P.pos.z); if (dd < it.r && Math.abs(it.pos.y - P.pos.y) < 4 && dd < bd){ bd = dd; best = it; } }

}

/* ============ DOOR RUN ============ */
function doorQ(q, max = 3){
  const opts = q.options.map(o => ({ text:stripTags(o.html), color:artColorOf(o.html), ok:o.val === q.correct }));
  const right = opts.filter(o => o.ok).slice(0, 1), wrong = shuffle(opts.filter(o => !o.ok)).slice(0, max - 1);
  return { prompt:q.prompt, say:q.say, opts:shuffle([...right, ...wrong]), id:q.id, explainEs:q.explainEs, answer:stripTags(q.answerHTML || ''), sayAfter:q.sayAfter, type:q.type };
}
class DoorRun extends Activity {
  constructor(title, qs, o = {}){ super(); this.title = title; this.qs = qs; this.total = qs.length; this.o = o; this.secs = []; this.cur = -1; }
  setup(){
    const sk = this.o.sky || ['#1d2547', '#6f7fb8']; setSky(sk[0], sk[1], sk[1], 50, 200);

      if (8 - x > 0.01) this.B(x + (8 - x) / 2, 3.5, zw, 8 - x, 7, 1, '#1f2937');
      const sec = { q, z0, zw, xs, cp:this.W(0, 0.05, z0 - 1), chosen:null, missed:false };
      q.opts.forEach((o, k) => {
        const cx = xs[k];

        sp.position.set(AO.x + cx, AO.y + 8.4 + (sp.scale.y - 0.7) / 2, AO.z + zw + 0.6); this.group.add(sp);
        if (o.ok) this.B(cx, -0.5, zw - 4.7, 4.2, 1, 9.4, '#415270');

  showQ(force){
    const s = this.secs[this.cur]; if (!s) return;
    banner(`<span class="b-num">${this.cur + 1}/${this.total}</span> ${s.q.prompt}`, 'Lauf durch die richtige Tür!');

  }

    if (idx >= 0 && idx !== this.cur){ this.cur = idx; P.checkpoint.copy(this.secs[idx].cp); this.showQ(); }
    const s = this.secs[this.cur];

          banner(`✘ Richtig ist: <b>${esc(s.q.answer || s.q.opts.find(x => x.ok).text)}</b>`, s.q.explainEs || '');
        }

    const id = pick(pickWords(this.pool, 6)), w = WMAP[id], mode = pick(this.modes(w));

    this.drones.forEach((d, i) => {

    });

    banner(P2[mode], 'Schieß die richtige Drohne ab · die anderen schießen zurück!');

  hit(d){

    const w = this.cur.w, pos = d.g.getWorldPosition(new V3());

      SFX.boom(); burst(pos, '#3de0ff', 30, 11); d.g.visible = false; speak(nounLabel(w));
      popText(pos, `✔ ${wordHTML(w)} = <i>${esc(w.es)}</i>`);

      this.cur.tries++; if (this.cur.tries === 1) onAnswer('wrong', { id:w.id });
      SFX.bad(); d.flash = 0.5;
      banner(`✘ Das ist ${wordHTML(d.word)} = <i>${esc(d.word.es)}</i>`, `Gesucht: ${wordHTML(w)} — die goldene Drohne!`);
      speak(nounLabel(d.word));

      const good = this.drones.find(x => x.word.id === w.id); good.hl = true; good.g.userData.eye.material = M('#ffc83d', { em:'#ffc83d', emi:1.4 });
    }

      d.g.position.set(AO.x + Math.sin(t) * (10 + i), AO.y + 4 + Math.sin(t * 2.3) * 1.5 + i * 0.4, AO.z + Math.cos(t * 1.3) * 9 - 2);

      if (d) fireOrb(d.g.getWorldPosition(new V3()), P.pos.clone().add(new V3(0, 1.4, 0)), 11 + Math.min(6, this.k * 0.3));

    }
    if (S.hearts <= 0 && !this._done){ toast('💀 Keine Herzen mehr!', 'bad'); this.fail(); }
    astat(this.endless ? `Arena · Treffer: <b>${this.k}</b> · Rekord ${S.arenaBest}` : `⏱ ${hudTime(this.t)} · ✔ ${this.correct} · ${this.k}/${this.total}`);
  }
}

  update(dt){
    this.baseUpdate(dt);

      if (c.placed) return;
      if (c === this.carry){ c.g.position.set(P.pos.x, P.pos.y + 4, P.pos.z); c.g.rotation.y += dt * 3; return; }
      c.g.position.set(AO.x + c.hx, AO.y + 1.4 + Math.sin(this.t * 2 + i) * 0.25, AO.z + c.hz); c.g.rotation.y += dt;

  }

      banner(`✘ Nummer ${pad.L.n} ist nicht <b>${esc(labelText(L))}</b>`, `Tipp: Nummer ${pad.L.n} = <i>${esc(WMAP[pad.L.id].es)}</i> · ${esc(labelText(L))} = <i>${esc(WMAP[L.id].es)}</i>`);
      this.state[pad.L.n] = 'bad'; this.redraw(); setTimeout(() => { if (this.state[pad.L.n] === 'bad'){ delete this.state[pad.L.n]; this.redraw(); } }, 900);
    }
  }
  startPhase2(){
    this.phase = 2; SFX.win();
    this.todo = sample(this.pads, 5); this.todo.forEach(p => { p.state = 'todo'; this.state[p.L.n] = 'hi'; });
    this.crystals.forEach(c => { if (this.todo.some(p => p.L.n === c.L.n)) c.g.visible = false; });

  }
  async ask(pad){

    const q = { type:'type', id:L.id, prompt:`Was ist Nummer <b>${L.n}</b>? (mit Artikel)`, media:diagramSVG(this.key, { hi:L.n, only:[L.n] }), accept:labelAccepts(L), answerHTML:labelHTML(L),
      explain:wordExplain(WMAP[L.id]), explainEs:wordTip(WMAP[L.id]), es:`Escribe el nombre del número ${L.n} con su artículo.`, sayAfter:labelText(L), placeholder:'der / die / das + Wort' };

    const c = this.crystals.find(x => x.L.n === L.n); if (c){ c.g.visible = true; }
    const done = this.todo.filter(p => p.state === 'ok').length;
    astat(`Schreib-Phase · ${done}/5`);
    P.frozen = false; this.asking = false;

function bossQ(z, phase){
  const r = Math.random();
  if (z <= 3){
    const key = ZONES[z].topic, ids = topicIds(key), tf = TF.filter(x => x.t === key);
    if (phase === 0) return r < 0.35 ? qLabel(key) : wq(ids, ['es2de', 'de2es', 'art', 'def']);
    if (phase === 1) return r < 0.4 ? qLabel(key) : r < 0.7 ? qTF(pick(tf)) : wq(ids, ['art', 'ex', 'audio']);
    return r < 0.5 ? qLabelType(key) : wq(ids, ['type']);
  }
  if (z === 4){
    const ids = topicIds('schnabel');
    if (phase === 0) return qBeak();
    if (phase === 1) return r < 0.5 ? qBeak() : qTF(pick(TF.filter(x => x.t === 'schnabel')));
    return r < 0.45 ? wq(ids.filter(id => WMAP[id].art), ['type']) : r < 0.75 ? qFix(pick(BEAK_FIX)) : qBeak();

  const ids = topicIds('merkmale');
  if (phase === 0) return qMerkmal();
  if (phase === 1) return r < 0.55 ? qTF(pick(TF.filter(x => x.t === 'merkmale'))) : qMerkmal();
  return r < 0.5 ? wq(ids, ['type']) : qMerkmal();
}

async function terminalStation(z, def){
  const ids = pickWords(topicIds(def.arg, w => !w.po), 6);
  const qs = ids.map((id, k) => (k % 2 && hasVoice(nounLabel(WMAP[id])) ? MAKERS.dictation : MAKERS.type)(WMAP[id]));
  let correct = 0, total = 0;
  const locks = n => `<div class="locks">${Array.from({ length:qs.length }, (_, i) => `<span class="${i < n ? 'open' : ''}">${i < n ? '🔓' : '🔒'}</span>`).join('')}</div>`;
  for (let i = 0; i < qs.length; i++){
    openModal(`<div class="term-head"><span>CODE-TERMINAL // ${esc(ZONES[z].name.toUpperCase())}</span>${locks(i)}</div><div id="qmount"></div>`, 'wide terminal');
    const r = await askQ(qs[i], $('#qmount'), { timeLimit:30 });
    total++; if (r.result === 'right') correct++; else if (r.result === 'close') correct += 0.5;
  }
  if (def.cloze){ const r = await clozePart(def.cloze); correct += r.c; total += r.n; }

function parseCloze(text){
  const out = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(text))){ if (m.index > last) out.push({ t:text.slice(last, m.index) }); const [shown, id] = m[1].split('|'); out.push({ blank:true, shown, id:id || idOf(shown) }); last = re.lastIndex; }
  if (last < text.length) out.push({ t:text.slice(last) });
  return out;
}
function clozePart(key){
  const C = CLOZE[key], text = pick(C.parts), toks = parseCloze(text), blanks = toks.filter(t => t.blank);
  const topic = WMAP[blanks[0].id] ? WMAP[blanks[0].id].t : 'aussen';
  const extra = sample(WORDS.filter(w => w.t === topic && !blanks.some(b => b.shown === w.de) && w.art), 2).map(w => w.de);
  const bank = shuffle([...blanks.map(b => ({ text:b.shown })), ...extra.map(t => ({ text:t }))]);
  const fill = new Array(blanks.length).fill(null); let sel = 0, checked = false; const res = { c:0, n:blanks.length };
  return new Promise(done => {
    const render = () => {
      let bi = 0;
      const body = toks.map(t => { if (!t.blank) return esc(t.t); const k = bi++, f = fill[k];
        const cls = checked ? (f != null && bank[f].text === blanks[k].shown ? 'ok' : 'bad') : (k === sel ? 'sel' : '');
        return `<button class="gap ${cls}" type="button" data-k="${k}">${f != null ? esc(bank[f].text) : '&nbsp;'}</button>${checked && cls === 'bad' ? `<span class="fix">${esc(blanks[k].shown)}</span>` : ''}`; }).join('');
      const used = new Set(fill.filter(x => x != null));
      openModal(`<div class="term-head"><span>ENTSCHLÜSSELN // ${esc(C.title.toUpperCase())} (${esc(C.src)})</span></div>
        <p class="sub">Der Text aus deinem Arbeitsblatt ist beschädigt. Klicke eine Lücke und dann ein Wort. <span class="es-inline">Haz clic en un hueco y luego en una palabra.</span></p>
        <div class="cloze">${body}</div><div class="chips">${bank.map((b, i) => `<button class="chip" type="button" data-i="${i}" ${used.has(i) || checked ? 'disabled' : ''}>${esc(b.text)}</button>`).join('')}</div>
        <div class="fb-actions">${checked ? `<span class="score-note">✔ ${res.c} / ${blanks.length}</span><button class="btn" id="cz-next" type="button">Weiter ⏎</button>` : `<button class="btn ghost" id="cz-clear" type="button">Leeren</button><button class="btn" id="cz-check" type="button" ${fill.includes(null) ? 'disabled' : ''}>Prüfen</button>`}</div>`, 'wide terminal');
      $$('.gap', sheet).forEach(b => b.onclick = () => { if (checked) return; const k = +b.dataset.k; fill[k] = null; sel = k; render(); });
      $$('.chip', sheet).forEach(b => b.onclick = () => { if (checked) return; const i = +b.dataset.i; fill[sel] = i; SFX.click(); speak(bank[i].text); const nx = fill.findIndex(x => x == null); sel = nx >= 0 ? nx : sel; render(); });
      if (checked) $('#cz-next').onclick = () => { pop(); done(res); };
      else { $('#cz-check').onclick = check; $('#cz-clear').onclick = () => { fill.fill(null); sel = 0; render(); }; }
    };
    const check = () => { checked = true; blanks.forEach((b, k) => { const ok = fill[k] != null && bank[fill[k]].text === b.shown; if (ok) res.c++; if (b.id) onAnswer(ok ? 'right' : 'wrong', { id:b.id }); }); res.c === blanks.length ? SFX.win() : SFX.bad(); render(); };
    const pop = pushKeys(e => { if (e.code === 'Enter'){ if (checked){ pop(); done(res); } else if (!fill.includes(null)) check(); return true; } return false; });
    render();
  });
}
async function sentenceParts(n){
  let score = 0; const birds = sample(BEAKS, n);
  for (const b of birds){
    const target = [`${b.art} ${b.name}`, 'hat', 'einen', b.adj, b.noun, 'um', b.foodTile, 'zu fressen.'];
    const base = b.adj.replace(/en$/, ''), other = pick(BEAKS.filter(x => x !== b));
    const bank = shuffle([...target, base + 'er', base, other.foodTile, 'für']);
    let pos = 0, mistakes = 0; const used = new Set();
    const m = await new Promise(done => {
      const render = () => {
        openModal(`<div class="term-head"><span>SATZ-CODE // ${esc(b.art + ' ' + b.name).toUpperCase()}</span></div>
          <p class="sub">Baue den Satz wie im Test: Welcher Schnabel, und wozu? <span class="es-inline">(${esc(WMAP[b.id].es)}: ${esc(b.es)})</span></p>
          <div class="sent-line">${target.slice(0, pos).map(t => `<span class="tok ok">${esc(t)}</span>`).join(' ')} ${pos < target.length ? '<span class="tok cursor">▌</span>' : ' ✔'}</div>
          <div class="chips">${bank.map((t, i) => `<button class="chip" type="button" data-i="${i}" ${used.has(i) ? 'disabled' : ''}>${esc(t)}</button>`).join('')}</div>
          ${mistakes >= 2 && pos < target.length ? `<p class="es">Pista: la palabra siguiente es «${esc(target[pos])}».</p>` : ''}`, 'wide terminal');
        $$('.chip', sheet).forEach(btn => btn.onclick = () => {
          const i = +btn.dataset.i;
          if (bank[i] === target[pos]){ used.add(i); pos++; SFX.click(); if (pos === target.length){ const s = target.join(' '); speak(s); SFX.ok(); render(); setTimeout(() => done(mistakes), 1600); return; } render(); }
          else { mistakes++; SFX.bad(); btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 400); if (mistakes === 2) render(); }
        });
      };
      render();
    });
    const pts = m === 0 ? 1 : m === 1 ? 0.5 : 0; score += pts; onAnswer(pts === 1 ? 'right' : pts ? 'close' : 'wrong', { id:b.id });
  }
  return { c:score, n:birds.length };
}

const portraitCache = {};
let pRenderer = null;
function portraitURL(kind){
  if (portraitCache[kind]) return portraitCache[kind];
  try {
    if (!pRenderer){ pRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true }); pRenderer.setSize(220, 220); pRenderer.outputEncoding = THREE.sRGBEncoding; }
    const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(lin('#ffffff'), lin('#445'), 1.1)); const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 4, 5); sc.add(dl);
    let m, h = 2.3, dist = 3.6;
    if (kind === 'geier' || BOSSES[kind]){ const B = bossModel(kind === 'geier' ? 'geier' : BOSSES[kind].kind); m = B.root; h = 6; dist = 11; }
    else m = npcModel(kind, 1);
    sc.add(m);
    const c = new THREE.PerspectiveCamera(35, 1, 0.1, 100); c.position.set(dist * 0.35, h + 0.2, dist); c.lookAt(0, h - 0.2, 0);
    pRenderer.render(sc, c);
    portraitCache[kind] = pRenderer.domElement.toDataURL();
  } catch (e) { portraitCache[kind] = ''; }
  return portraitCache[kind];
}
