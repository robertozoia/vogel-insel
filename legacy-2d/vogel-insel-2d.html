<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Die Vogel-Insel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lilita+One&display=swap">
<style>
:root{
  --sea:#0f3a48; --sea-deep:#0a2a35; --parch:#f6ecd2; --parch-2:#efe1bf; --line:#cbb994; --ink:#2a2119; --ink-2:#5c4d3c;
  --ember:#e2742f; --ember-2:#b4531a; --teal:#3f6f7d; --teal-2:#27505c; --gold:#f2b632;
  --der:#2563c9; --die:#c93a2f; --das:#1f8a47; --ok:#2f9e55; --bad:#c9412f; --warn:#c98a12;
  --display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body{ height:100%; }
[hidden]{ display:none !important; }
body{ margin:0; background:var(--sea-deep); color:var(--parch); font-family:var(--body); overflow:hidden; }
#app{ position:fixed; inset:0; background:radial-gradient(ellipse at 50% 40%, #1d5a6b, var(--sea-deep) 72%); }
#stage{ position:absolute; left:50%; top:50%; width:960px; height:600px; transform-origin:center center; border-radius:14px; overflow:hidden; background:var(--sea-deep); box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 3px rgba(246,236,210,.12); }
#cv{ position:absolute; inset:0; width:960px; height:600px; display:block; cursor:pointer; }
button{ font:inherit; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

/* HUD */
#hud{ position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; pointer-events:none; gap:8px; z-index:3; }
.hud-group{ display:flex; gap:8px; align-items:center; pointer-events:auto; }
.pill{ background:rgba(15,32,38,.8); border:2px solid rgba(246,236,210,.22); border-radius:999px; padding:3px 12px; font-family:var(--display); font-size:18px; display:flex; gap:6px; align-items:center; color:var(--parch); white-space:nowrap; }
#h-hearts span{ color:#ff5b5b; font-size:20px; line-height:1; } #h-hearts .empty{ color:#5a3b3b; }
.xpbar{ width:80px; height:8px; background:#26343a; border-radius:4px; overflow:hidden; } .xpbar i{ display:block; height:100%; background:var(--gold); width:0; transition:width .4s; }
#h-combo{ background:var(--ember); border-color:#ffd0a8; animation:pop .3s; }
.iconbtn{ width:38px; height:38px; border-radius:50%; border:2px solid rgba(246,236,210,.25); background:rgba(15,32,38,.8); color:var(--parch); font-size:18px; cursor:pointer; display:grid; place-items:center; padding:0; }
.iconbtn:hover{ background:rgba(40,70,80,.9); } .iconbtn.off{ opacity:.45; }
#quest{ position:absolute; left:12px; bottom:12px; max-width:600px; background:rgba(15,32,38,.84); border:2px solid rgba(246,236,210,.2); border-radius:12px; padding:7px 12px; font-size:14px; line-height:1.35; z-index:2; }
#quest b{ font-family:var(--display); font-weight:400; color:var(--gold); letter-spacing:.02em; }
.es-inline{ color:#b9c9c4; font-style:italic; font-size:.92em; }
.muted-l{ color:#b9c9c4; }
.sheet .es-inline, #panel .es-inline{ color:#8a6a3a; }
#toasts{ position:absolute; top:108px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:6; pointer-events:none; width:560px; }
.toast{ background:rgba(15,32,38,.92); border:2px solid rgba(246,236,210,.25); border-radius:10px; padding:7px 14px; font-size:15px; text-align:center; animation:tin .25s ease-out; transition:opacity .4s, transform .4s; max-width:100%; }
.toast.out{ opacity:0; transform:translateY(-8px); }
.toast.gold{ border-color:var(--gold); } .toast.ok{ border-color:#6fd08a; } .toast.bad{ border-color:#ff8a7e; } .toast.zone{ font-family:var(--display); font-size:20px; }
.toast.zone .es-inline, .toast.zone .muted-l{ font-family:var(--body); font-size:14px; }
@keyframes tin{ from{ opacity:0; transform:translateY(-10px); } }
@keyframes pop{ 50%{ transform:scale(1.15); } }

/* sheets (modal) */
#modal{ position:absolute; inset:0; background:rgba(5,20,26,.55); display:grid; place-items:center; z-index:8; }
.sheet{ background:var(--parch); color:var(--ink); width:680px; max-width:calc(100% - 40px); max-height:560px; overflow:auto; border-radius:14px; padding:18px 24px 16px; box-shadow:0 0 0 3px #3a2e22, 6px 8px 0 3px rgba(0,0,0,.35); position:relative;
  background-image:linear-gradient(transparent 31px, rgba(160,130,80,.08) 32px); background-size:100% 32px; }
.sheet.wide{ width:900px; }
.sheet.title{ width:620px; text-align:center; background-image:none; }
.sheet h1{ font-family:var(--display); font-weight:400; font-size:64px; line-height:1; margin:4px 0 8px; color:var(--ember); text-shadow:3px 3px 0 #3a2e22; letter-spacing:.01em; text-wrap:balance; }
.sheet h2{ font-family:var(--display); font-weight:400; font-size:28px; margin:0 0 8px; color:var(--ink); letter-spacing:.01em; text-wrap:balance; }
.sheet h3{ font-family:var(--display); font-weight:400; font-size:20px; margin:16px 0 6px; color:var(--teal-2); }
.sheet p{ margin:6px 0; line-height:1.45; }
.eyebrow{ text-transform:uppercase; letter-spacing:.14em; font-size:12px; color:var(--ink-2); margin:0; }
.tagline{ font-size:17px; max-width:48ch; margin:0 auto !important; }
.sheet .es{ color:#7a5a2a; font-style:italic; }
.sheet .muted, .muted{ color:#8a7a64; }
.sheet .small{ font-size:13px; }
.sub{ color:var(--ink-2); }
.center{ text-align:center; }
.center-actions{ justify-content:center !important; }
.name-row{ display:inline-flex; gap:8px; align-items:center; margin:12px 0 2px; font-weight:700; }
.name-row input, .set-row input[type=text]{ font:inherit; font-size:17px; padding:5px 10px; border:2px solid var(--ink-2); border-radius:8px; background:#fffdf7; color:var(--ink); width:180px; }
.series-head, .exam-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.prog{ font-family:var(--display); color:var(--ink-2); font-size:17px; white-space:nowrap; font-variant-numeric:tabular-nums; }

/* buttons */
.btn{ font-family:var(--display); font-size:18px; letter-spacing:.02em; background:var(--ember); color:#fff8ea; border:none; border-bottom:4px solid var(--ember-2); border-radius:10px; padding:7px 16px 6px; cursor:pointer; }
.btn:hover{ filter:brightness(1.07); } .btn:active{ transform:translateY(2px); border-bottom-width:2px; }
.btn:disabled{ opacity:.45; cursor:default; filter:none; transform:none; }
.btn.alt{ background:var(--teal); border-bottom-color:var(--teal-2); }
.btn.ghost{ background:transparent; color:var(--ink); border:2px solid var(--ink-2); border-bottom-width:4px; }
.btn.tiny{ font-size:14px; padding:4px 10px 3px; border-bottom-width:3px; }
.btn.big{ font-size:26px; padding:10px 28px 8px; }
.btn.hold{ position:relative; overflow:hidden; } .btn.hold .fill{ position:absolute; inset:0; width:0; background:rgba(226,116,47,.25); }
.btn.hold.holding .fill{ width:100%; transition:width 1.5s linear; }
.fb-actions{ display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:12px; flex-wrap:wrap; }
.say{ border:none; background:none; cursor:pointer; font-size:16px; padding:0 2px; vertical-align:middle; }
kbd{ font-family:var(--display); font-size:13px; background:var(--parch-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 6px; color:var(--ink-2); }

/* article colours */
.art-der{ color:var(--der); } .art-die{ color:var(--die); } .art-das{ color:var(--das); }

/* question */
.q-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.q-prompt{ font-size:19px; line-height:1.4; }
.q-help{ background:#fff4d6; border-left:4px solid var(--gold); padding:6px 10px; border-radius:6px; margin:6px 0; color:#6a4a1a; font-style:italic; }
.big{ font-family:var(--display); font-size:34px; margin:4px 0; } .big small{ font-family:var(--body); font-size:15px; color:var(--ink-2); }
.big-es{ font-size:26px; font-weight:700; color:#7a5a2a; font-style:italic; margin:4px 0; }
.def{ font-size:19px; background:#fffaf0; border:1px dashed var(--line); border-radius:8px; padding:6px 10px; margin:6px 0; }
.blank{ letter-spacing:.1em; color:var(--ember-2); font-weight:700; }
.emoji-big{ font-size:30px; vertical-align:middle; }
.q-body{ display:flex; gap:14px; align-items:flex-start; margin-top:8px; }
.q-media{ flex:0 0 300px; } .q-media .diag{ width:300px; }
.q-main{ flex:1; min-width:0; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opts.art{ grid-template-columns:repeat(3, 1fr); } .opts.tf{ grid-template-columns:1fr 1fr; }
.opt{ background:#fffaf0; color:var(--ink); border:2px solid var(--line); border-bottom-width:4px; border-radius:10px; padding:8px 10px; font-size:17px; text-align:left; cursor:pointer; display:flex; gap:8px; align-items:center; line-height:1.3; }
.opt:hover:not(:disabled){ border-color:var(--ink-2); background:#fff; }
.opt.right{ background:#d8f3df; border-color:var(--ok); } .opt.wrong{ background:#fbe0dc; border-color:var(--bad); }
.opt:disabled{ cursor:default; }
.art-btn{ justify-content:center; font-family:var(--display); font-size:26px; color:#fff; border:none; border-bottom:5px solid rgba(0,0,0,.25); }
.art-btn.art-der{ background:var(--der); } .art-btn.art-die{ background:var(--die); } .art-btn.art-das{ background:var(--das); }
.art-btn kbd{ background:rgba(255,255,255,.25); border-color:transparent; color:#fff; }
.art-btn.right{ box-shadow:0 0 0 4px var(--ok); } .art-btn.wrong{ opacity:.55; }
.tf-r, .tf-f{ justify-content:center; font-family:var(--display); font-size:22px; }
.typerow{ display:flex; gap:8px; }
input.answer{ flex:1; font:inherit; font-size:22px; padding:6px 12px; border:2px solid var(--ink-2); border-radius:8px; background:#fffdf7; color:var(--ink); min-width:0; }
input.right, select.right{ border-color:var(--ok) !important; background:#e3f6e8 !important; } input.close{ border-color:var(--warn) !important; background:#fff2d6 !important; } input.wrong, select.wrong, textarea.wrong{ border-color:var(--bad) !important; background:#fbe6e2 !important; }
.umlauts{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
.uml{ font:inherit; font-size:17px; font-weight:700; width:34px; height:32px; border:2px solid var(--line); border-bottom-width:3px; background:#fffaf0; color:var(--ink); border-radius:7px; cursor:pointer; }
.timer{ height:6px; background:var(--parch-2); border-radius:3px; margin-top:10px; overflow:hidden; } .timer i{ display:block; height:100%; width:100%; background:var(--ember); }
.fb{ margin-top:10px; padding:8px 12px; border-radius:10px; background:#fffaf0; border:2px solid var(--line); animation:tin .2s; }
.fb.right{ border-color:#8fd3a2; } .fb.wrong{ border-color:#eba59a; } .fb.close{ border-color:#e9c77a; }
.fb-title{ font-family:var(--display); font-size:21px; } .fb-title.ok{ color:var(--ok); } .fb-title.bad{ color:var(--bad); } .fb-title.warn{ color:var(--warn); }
.fb-msg{ font-weight:700; margin:3px 0; }
.fb-ex{ margin-top:4px; } .fb-ex .ex{ color:var(--ink-2); margin-top:2px; }
.fb .fb-actions{ margin-top:6px; }
.combo{ background:var(--ember); color:#fff; border-radius:999px; padding:0 8px; font-size:15px; }

/* battle panel */
#panel{ position:absolute; left:14px; right:14px; bottom:12px; max-height:318px; overflow:auto; background:var(--parch); color:var(--ink); border-radius:14px; padding:12px 16px; z-index:5; box-shadow:0 0 0 3px #3a2e22, 5px 6px 0 3px rgba(0,0,0,.3); }
.q.compact .q-prompt{ font-size:18px; } .q.compact .big{ font-size:28px; } .q.compact .q-media{ flex-basis:250px; } .q.compact .q-media .diag{ width:250px; }
.q.compact .fb{ padding:6px 10px; } .q.compact .fb-ex .ex{ display:none; }
.speech .who, .dlg .who{ font-family:var(--display); font-size:20px; color:var(--ember-2); }
.speech .de, .dlg .de{ font-size:19px; }

/* dialogues */
.dlg{ display:flex; gap:16px; align-items:flex-start; }
.dlg-face{ flex:0 0 120px; } .portrait{ width:120px; height:120px; display:block; }
.dlg-body{ flex:1; }
.dots{ margin-right:auto; display:flex; gap:4px; } .dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .dots i.on{ background:var(--ember); }
.menu-list{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.quote{ font-size:19px; font-style:italic; }
.big-emoji{ font-size:54px; line-height:1.1; }
.score-big{ font-family:var(--display); font-size:52px; color:var(--ember); margin:0 !important; font-variant-numeric:tabular-nums; }
.stars-big{ font-size:52px; letter-spacing:.08em; margin:0 !important; color:#d9cba8; } .stars-big .on{ color:var(--gold); text-shadow:2px 2px 0 #7a5a0a; }
.stars-row{ color:var(--gold); font-size:22px; letter-spacing:.1em; margin:0 !important; }
.gold-note{ background:#fff1c9; border:2px solid var(--gold); border-radius:8px; padding:6px 10px; display:inline-block; }
.score-note{ font-family:var(--display); font-size:18px; color:var(--ink-2); margin-right:auto; }
.st-intro{ text-align:center; } .st-icon{ font-size:50px; } .st-intro .lead{ font-size:19px; font-weight:700; } .how{ background:#fffaf0; border:1px dashed var(--line); border-radius:8px; padding:6px 10px; display:inline-block; }

/* diagrams, labeling */
.diag{ width:100%; height:auto; display:block; border-radius:10px; border:2px solid var(--line); }
.diag .lead{ stroke:#3a2e22; stroke-width:1.4; } .diag .dot{ fill:#3a2e22; }
.diag .mk circle{ fill:#fffaf0; stroke:#3a2e22; stroke-width:2; } .diag .mk text{ font:700 13px var(--body); fill:#2a2119; pointer-events:none; }
.diag .mk{ cursor:pointer; } .diag .mk:hover circle{ fill:#ffe9a8; }
.diag .mk.ok circle{ fill:#bfe8c9; stroke:var(--ok); } .diag .mk.hi circle{ fill:#ffd66b; stroke:var(--ember-2); stroke-width:3; } .diag .mk.bad circle{ fill:#ff9c8f; }
.label-wrap{ display:grid; grid-template-columns:1.35fr 1fr; gap:14px; align-items:start; }
.slots{ list-style:none; padding:0; margin:0; display:grid; gap:3px; font-size:16px; }
.slots li{ display:flex; gap:8px; align-items:center; min-height:26px; } .slots li.ok{ color:var(--ok); }
.slots .num{ font-family:var(--display); width:26px; height:26px; flex:0 0 26px; border-radius:50%; background:#fffaf0; border:2px solid #3a2e22; display:grid; place-items:center; font-size:13px; color:var(--ink); }
.slots.exam input{ font:inherit; font-size:16px; padding:3px 8px; border:2px solid var(--ink-2); border-radius:6px; background:#fffdf7; color:var(--ink); width:100%; min-width:0; }
.slots .fix{ font-size:14px; white-space:nowrap; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 2px; }
.chip{ background:#fffaf0; border:2px solid var(--line); border-bottom-width:4px; border-radius:999px; padding:4px 12px; font-size:16px; cursor:pointer; color:var(--ink); }
.chip:hover:not(:disabled){ border-color:var(--ink-2); } .chip.sel{ background:#ffe9a8; border-color:var(--ember); } .chip.used, .chip:disabled{ opacity:.35; cursor:default; }
.chip.shake{ animation:shake .35s; border-color:var(--bad); }
@keyframes shake{ 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }

/* cloze */
.cloze{ font-size:18px; line-height:2.1; background:#fffaf0; border:1px solid var(--line); border-radius:10px; padding:8px 14px; }
.gap{ min-width:90px; font:inherit; font-size:17px; border:none; border-bottom:3px solid var(--ink-2); background:#f3e6c6; border-radius:6px 6px 0 0; padding:0 8px; cursor:pointer; color:var(--ink); font-weight:700; }
.gap.sel{ background:#ffe9a8; border-bottom-color:var(--ember); } .gap.ok{ background:#d8f3df; border-bottom-color:var(--ok); } .gap.bad{ background:#fbe0dc; border-bottom-color:var(--bad); text-decoration:line-through; }
.fix{ color:var(--ok); font-weight:700; margin-left:4px; }

/* sentence builder */
.sent-bird{ display:flex; gap:12px; align-items:center; background:#fffaf0; border-radius:10px; padding:4px 10px; border:1px solid var(--line); }
.sent-line{ font-size:21px; min-height:40px; margin:10px 0; padding:6px 10px; border-bottom:3px dashed var(--line); }
.tok.ok{ color:var(--ok); font-weight:700; } .tok.cursor{ color:var(--ember); animation:blink 1s infinite; }
@keyframes blink{ 50%{ opacity:.2; } }

/* study card, lexikon */
.card-lines{ list-style:none; padding:0; margin:0; display:grid; gap:6px; } .card-lines li{ background:#fffaf0; border-radius:8px; padding:6px 10px; border-left:4px solid var(--teal); }
.card-lines .de{ font-weight:700; }
.terms{ display:flex; flex-wrap:wrap; gap:6px; }
.term{ display:flex; flex-direction:column; align-items:flex-start; border:2px solid var(--line); background:#fffaf0; border-radius:8px; padding:3px 9px; cursor:pointer; font-weight:700; font-size:15px; }
.term small{ font-weight:400; color:#7a5a2a; font-style:italic; font-size:12px; }
.term.art-der{ border-left:5px solid var(--der); } .term.art-die{ border-left:5px solid var(--die); } .term.art-das{ border-left:5px solid var(--das); }
.path{ font-size:18px; background:#fffaf0; border-radius:8px; padding:6px 10px; }
.merk li{ margin:3px 0; }
.tabs{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.tab{ border:2px solid var(--line); background:#fffaf0; border-radius:999px; padding:3px 12px; cursor:pointer; color:var(--ink); font-size:15px; }
.tab.on{ background:var(--teal); color:#fff; border-color:var(--teal-2); }
.tabs input{ margin-left:auto; font:inherit; padding:4px 10px; border:2px solid var(--line); border-radius:999px; background:#fffdf7; color:var(--ink); width:230px; }
.lgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; }
.lcard{ position:relative; text-align:left; display:flex; flex-direction:column; gap:1px; background:#fffaf0; border:2px solid var(--line); border-left-width:6px; border-radius:10px; padding:7px 10px; cursor:pointer; color:var(--ink); font-size:16px; }
.lcard.art-der{ border-left-color:var(--der); } .lcard.art-die{ border-left-color:var(--die); } .lcard.art-das{ border-left-color:var(--das); }
.lcard b{ color:inherit; padding-right:20px; overflow-wrap:anywhere; } .lcard small{ color:var(--ink-2); font-size:12px; } .lcard .es{ font-size:13px; }
.lcard .tier{ position:absolute; right:6px; top:4px; font-size:15px; }
.lcard.t0{ opacity:.7; } .lcard.t3{ background:#fff4cf; border-color:var(--gold); }
.legend{ margin-top:8px; font-weight:700; font-size:14px; }

/* shop, badges, settings, tables */
.shop-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); }
.shop-ico{ font-size:26px; width:36px; text-align:center; } .shop-name{ flex:1; font-weight:700; }
.badges{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.badge{ display:flex; flex-direction:column; align-items:center; text-align:center; background:#efe6d0; border-radius:10px; padding:8px; opacity:.5; filter:grayscale(1); }
.badge.on{ opacity:1; filter:none; background:#fff4cf; border:2px solid var(--gold); } .badge .bi{ font-size:28px; } .badge small{ color:var(--ink-2); }
.set-row{ display:flex; gap:10px; align-items:center; margin:8px 0; font-size:17px; } .set-row input[type=checkbox]{ width:20px; height:20px; accent-color:var(--ember); }
.res-table{ border-collapse:collapse; width:100%; margin:6px 0; font-size:15px; }
.res-table td, .res-table th{ padding:4px 8px; border-bottom:1px dashed var(--line); text-align:left; }
.res-table .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.pbar{ height:10px; background:var(--parch-2); border-radius:5px; overflow:hidden; min-width:160px; } .pbar i{ display:block; height:100%; background:var(--teal); }
textarea{ font:inherit; font-size:17px; width:100%; box-sizing:border-box; border:2px solid var(--ink-2); border-radius:8px; padding:6px 10px; background:#fffdf7; color:var(--ink); resize:vertical; }
#pa-io textarea{ font-family:ui-monospace, monospace; font-size:12px; }

/* exam */
.sheet.exam{ background-image:none; background-color:#fbf7ec; }
.exam-head{ align-items:center; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:8px; }
.geier{ display:flex; gap:8px; align-items:center; font-family:var(--display); color:#6d5b8a; }
.geier .bar{ width:220px; height:12px; background:#e7dff0; border-radius:6px; overflow:hidden; } .geier .bar i{ display:block; height:100%; background:#6d5b8a; transition:width .6s; }
.exam-meta{ font-family:var(--display); color:var(--ink-2); }

const TOPICS_ES = { aussen:'Cuerpo por fuera', skelett:'El esqueleto', organe:'Los órganos', schnabel:'Los picos', merkmale:'Las características', op:'Palabras de los ejercicios' };

const WORDS = [];
function slug(s){ return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
// N = noun: article, word, plural ('*' = only plural, null = no plural), Spanish, topic, German definition, example, Spanish tip, extra accepted answers
function N(art,de,pl,es,t,def,ex,tip,alt){ WORDS.push({ id:slug(de), art, de, pl: pl==='*'?null:pl, po: pl==='*', es, t, def, ex, tip, alt }); }
// V = verb / adjective / expression (no article)
function V(de,es,t,def,ex,tip){ WORDS.push({ id:slug(de), art:null, de, pl:null, es, t, def, ex, tip }); }

N('der','Singvogel','Singvögel','el pájaro cantor','aussen','Ein kleiner Vogel, der singt.','Die Amsel und der Haussperling sind Singvögel.','singen = cantar');
N('der','Wasservogel','Wasservögel','el ave acuática','aussen','Ein Vogel, der am oder im Wasser lebt.','Der Pelikan ist ein Wasservogel.');

N('die','Amsel','Amseln','el mirlo','aussen',null,'Die Amsel ist ein Singvogel.','¡Ojo! die Amsel es femenino, pero EL mirlo.');

N('der','Pelikan','Pelikane','el pelícano','aussen',null,'Der Pelikan ist ein Wasservogel.');
N('der','Körperbau',null,'la estructura del cuerpo','aussen','Wie der Körper aufgebaut ist.','Alle Vögel haben einen gemeinsamen Körperbau.','Körper (cuerpo) + Bau (construcción)');

N('der','Kopf','Köpfe','la cabeza','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.','¡Ojo! der Kopf es masculino, pero LA cabeza.');

N('der','Schwanz','Schwänze','la cola','aussen',null,'Der Körper ist in Kopf, Rumpf und Schwanz gegliedert.','¡Ojo! der Schwanz, pero LA cola.');

N('der','Wirbel','Wirbel','la vértebra','skelett',null,'Die Wirbelsäule besteht aus vielen Wirbeln.');

let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, type = 'square', vol = 0.06, when = 0, slide = 0){
  if (!S.settings.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.08){
  if (!S.settings.sound) return; const a = ac(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol; s.buffer = b; s.connect(g); g.connect(a.destination); s.start();
}

/* ============================================================
   QUIZ — question generation, answer checking, question UI
   ============================================================ */
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fold(s){ return s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); }
function normT(s){ return s.replace(/[.,!?;:„“"'»«()]/g, ' ').replace(/\s+/g, ' ').trim(); }
function parseArt(s){ const m = s.match(/^(der|die|das)\s+(.+)$/i); return m ? { art:m[1].toLowerCase(), rest:m[2] } : { art:null, rest:s }; }
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length:n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function checkTyped(input, accepts){
  const inp = normT(input || '');
  if (!inp) return { res:'wrong', score:0, msg:'Keine Antwort.', target:accepts[0] };
  const pi = parseArt(inp);
  let best = null;
  for (const a of accepts){
    const pa = parseArt(normT(a));
    const needArt = !!pa.art;
    const exact = pi.rest === pa.rest, ci = pi.rest.toLowerCase() === pa.rest.toLowerCase(), fo = fold(pi.rest) === fold(pa.rest);
    const dist = lev(fold(pi.rest), fold(pa.rest));
    const close = pa.rest.length > 3 && dist <= (pa.rest.length > 8 ? 2 : 1);
    const artOk = !needArt || pi.art === pa.art;
    let res, score, msg = '';
    if ((exact || ci) && artOk){ res = 'right'; score = 5; if (!exact) msg = /^[A-ZÄÖÜ]/.test(pa.rest) ? 'Tipp: Nomen schreibt man groß!' : 'Tipp: Dieses Wort schreibt man klein.'; }
    else if (fo && artOk){ res = 'right'; score = 4; msg = 'Achte auf die Umlaute: ä, ö, ü, ß.'; }
    else if ((ci || fo) && !artOk){ res = 'wrong'; score = 3; msg = pi.art ? `Richtiges Wort, aber falscher Artikel! Es heißt <b class="${artClass(pa.art)}">${pa.art}</b>.` : `Der Artikel fehlt! Es heißt <b class="${artClass(pa.art)}">${pa.art} ${esc(pa.rest)}</b>.`; }
    else if (close && artOk){ res = 'close'; score = 2; msg = 'Fast! Nur ein kleiner Schreibfehler.'; }
    else if (close){ res = 'wrong'; score = 1; msg = 'Schreibfehler und falscher Artikel.'; }
    else { res = 'wrong'; score = 0; }
    if (!best || score > best.score) best = { res, score, msg, target:a, artOk, near: ci || fo || close };
  }
  return best;
}
function typedPoints(r){ return r.res === 'right' ? 1 : r.res === 'close' ? 0.75 : r.score === 3 ? 0.5 : r.score === 1 ? 0.25 : 0; }

/* ---------- helpers for words ---------- */
function wordExplain(w){ return `${wordHTML(w, true)} = <i>${esc(w.es)}</i>` + (w.ex ? `<div class="ex">„${esc(w.ex)}“ ${speakBtn(w.ex)}</div>` : ''); }
function wordTip(w){ return w.tip ? '💡 ' + esc(w.tip) : ''; }
function distractors(w, n){
  const cls = x => !!x.art === !!w.art;
  const same = WORDS.filter(x => x.id !== w.id && cls(x) && x.t === w.t && x.es !== w.es && x.de !== w.de);
  let d = sample(same, n);
  if (d.length < n) d = d.concat(sample(WORDS.filter(x => x.id !== w.id && cls(x) && x.t !== w.t && !d.includes(x)), n - d.length));
  return d;
}
function exForm(w){

let lastField = null;

/* ---------- ask one question ---------- */
let qUid = 0;
function askQ(q, mount, o = {}){
  return new Promise(resolve => {
    const uid = ++qUid, t0 = performance.now();
    let done = false, usedHelp = false, timer = null, autoT = null;
    const helpOn = q.es && !o.noHelp;
    let h = `<div class="q ${o.compact ? 'compact' : ''}"><div class="q-head"><div class="q-prompt">${q.prompt}</div>`;
    if (helpOn) h += `<button class="btn tiny help" type="button">🇪🇸 Ayuda</button>`;
    h += `</div>`;
    if (helpOn) h += `<div class="q-help" ${S.settings.es ? '' : 'hidden'}>${q.es}</div>`;
    h += `<div class="q-body">${q.media ? `<div class="q-media">${q.media}</div>` : ''}<div class="q-main">`;
    if (q.type === 'type') h += `<div class="typerow"><input class="answer" id="ans-${uid}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.placeholder || '')}" aria-label="Antwort"><button class="btn go" type="button">Prüfen ⏎</button></div>${umlautBar()}`;
    else h += `<div class="opts ${q.type}">` + q.options.map((op, i) => `<button class="opt ${op.cls || ''}" type="button" data-i="${i}"><kbd>${op.key || i + 1}</kbd><span>${op.html}</span></button>`).join('') + `</div>`;
    h += `</div></div>`;
    if (o.timeLimit) h += `<div class="timer"><i></i></div>`;
    h += `<div class="fb" hidden></div></div>`;
    mount.innerHTML = h;
    const root = mount.querySelector('.q');
    if (q.say) setTimeout(() => speak(q.say), 250);
    const helpBtn = root.querySelector('.help');
    if (helpBtn) helpBtn.onclick = () => { usedHelp = true; root.querySelector('.q-help').hidden = false; helpBtn.disabled = true; };
    const input = root.querySelector('input.answer');
    if (input) setTimeout(() => input.focus(), 30);
    if (o.timeLimit){
      const bar = root.querySelector('.timer i');
      requestAnimationFrame(() => { bar.style.transition = `width ${o.timeLimit}s linear`; bar.style.width = '0%'; });
      timer = setTimeout(() => answer(null, true), o.timeLimit * 1000);
    }
    root.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
    const go = root.querySelector('.go'); if (go) go.onclick = () => answer(input.value);
    const popKeys = pushKeys((e, typing) => {
      if (done){
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter'){ next(); return true; }
        return false;
      }
      if (q.type === 'type'){ if (e.code === 'Enter' || e.code === 'NumpadEnter'){ answer(input.value); return true; } return false; }
      if (typing) return false;
      let i = -1;
      if (/^Digit[1-9]$/.test(e.code)) i = +e.code.slice(5) - 1;
      else if (/^Numpad[1-9]$/.test(e.code)) i = +e.code.slice(6) - 1;
      else { const k = e.key && e.key.toUpperCase(); i = q.options.findIndex(op => op.key && op.key === k); }
      if (i >= 0 && i < q.options.length){ answer(i); return true; }
      return false;
    });
    function answer(val, timeout){
      if (done) return; done = true; clearTimeout(timer);
      const ms = performance.now() - t0;
      let res, msg = '';
      if (q.type === 'type'){
        const r = checkTyped(val || '', q.accept); res = r.res; msg = r.msg; input.disabled = true;
        input.classList.add(res === 'right' ? 'right' : res === 'close' ? 'close' : 'wrong');
      } else {
        const op = val == null ? null : q.options[val];
        res = op && op.val === q.correct ? 'right' : 'wrong';
        root.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; const v = q.options[i].val; if (v === q.correct) b.classList.add('right'); else if (i === val) b.classList.add('wrong'); });
      }
      if (timeout) msg = 'Die Zeit ist um!';
      if (!o.noReward) onAnswer(res, q);
      res === 'right' ? SFX.ok() : SFX.bad();
      if (q.sayAfter && (res !== 'right' || o.sayRight !== false)) setTimeout(() => speak(q.sayAfter), 150);
      const fb = root.querySelector('.fb');
      let f = res === 'right' ? `<div class="fb-title ok">✔ Richtig!${combo >= 3 && !o.noReward ? ` <span class="combo">🔥 ${combo}</span>` : ''}</div>`
        : res === 'close' ? `<div class="fb-title warn">≈ Fast richtig!</div><div>Richtig geschrieben: ${q.answerHTML}</div>`
        : `<div class="fb-title bad">✘ ${timeout ? 'Zeit ist um!' : 'Leider falsch.'}</div><div>Richtig ist: ${q.answerHTML}</div>`;
      if (msg && !timeout) f += `<div class="fb-msg">${msg}</div>`;
      if (q.explain) f += `<div class="fb-ex">${q.explain}</div>`;
      if (q.explainEs && (res !== 'right' || S.settings.es)) f += `<div class="es">${q.explainEs}</div>`;
      f += `<div class="fb-actions"><button class="btn go-next" type="button">Weiter ⏎</button></div>`;
      fb.innerHTML = f; fb.hidden = false; fb.className = 'fb ' + res;
      fb.querySelector('.go-next').onclick = next;
      if (res === 'right' && o.autoNext !== false) autoT = setTimeout(next, o.autoNext || 1300);
      result = { result:res, ms, help:usedHelp, timeout:!!timeout };
      if (o.onResult) o.onResult(result);
    }
    let result = null, finished = false;
    function next(){ if (finished) return; finished = true; clearTimeout(autoT); popKeys(); resolve(result); }
  });
}

/* ---------- a series of questions in the modal ---------- */
async function runSeries(title, qs, o = {}){
  let correct = 0;
  openModal(`<div class="series"><div class="series-head"><h2>${title}</h2><div class="prog" id="s-prog"></div></div>${o.sub ? `<p class="sub">${o.sub}</p>` : ''}<div id="qmount"></div></div>`, o.cls || '');
  for (let i = 0; i < qs.length; i++){
    $('#s-prog').textContent = `${i + 1} / ${qs.length} · ✔ ${correct}`;
    const r = await askQ(qs[i], $('#qmount'), o);
    if (r.result === 'right') correct++;
    else if (r.result === 'close') correct += 0.5;
  }
  return { correct, total:qs.length };
}
/* ============================================================
   SPRITES — everything is drawn in code, no image files
   ============================================================ */
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function ell(g, x, y, rx, ry, rot = 0){ g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); }
function circ(g, x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function rrect(g, x, y, w, h, r){ g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); }
function shadowAt(g, x, y, rx, ry){ g.fillStyle = 'rgba(0,0,0,.22)'; ell(g, x, y, rx, ry); }

function drawBeak(g, shape, c){
  g.fillStyle = c; g.beginPath();
  switch (shape){
    case 'thin': g.moveTo(22, -11); g.quadraticCurveTo(32, -11, 37, -3); g.lineTo(35, -2.5); g.quadraticCurveTo(30, -8, 22, -7); break;
    case 'hook': g.moveTo(21, -13); g.quadraticCurveTo(33, -14, 31, -3); g.quadraticCurveTo(28, -8, 21, -6); break;
    case 'chisel': g.moveTo(22, -12); g.lineTo(37, -10.5); g.lineTo(37, -8.3); g.lineTo(22, -6.5); break;
    case 'long': g.moveTo(22, -11.5); g.lineTo(49, -8); g.lineTo(22, -6); break;
    case 'flat': g.moveTo(21, -12); g.lineTo(32, -11.5); g.quadraticCurveTo(37, -9, 32, -6.3); g.lineTo(21, -6.5); break;
    case 'pouch': g.moveTo(21, -12); g.lineTo(47, -10.5); g.lineTo(45, -8); g.quadraticCurveTo(34, 3, 22, -4); break;
    default: g.moveTo(22, -12); g.lineTo(31, -9); g.lineTo(22, -6);
  }
  g.closePath(); g.fill();
}
// A generic bird facing right in local space; o = { col:{body,belly,head,beak,extra,leg}, shape, dir, t, after(g) }
function drawBird(g, x, y, s, o){
  g.save(); g.translate(x, y); g.scale((o.dir || 1) * s, s);
  if (!o.noShadow) shadowAt(g, 0, 23, 16, 4);
  g.strokeStyle = o.col.leg || '#c98a3a'; g.lineWidth = 2.2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-3, 12); g.lineTo(-5, 22); g.moveTo(4, 12); g.lineTo(4, 22); g.stroke();
  const bob = o.t ? Math.sin(o.t * 5) * 1.2 : 0;

  g.fillStyle = shade(o.col.body, -22); g.beginPath(); g.moveTo(-14, 0); g.lineTo(-30, -7); g.lineTo(-29, 5); g.closePath(); g.fill();
  g.fillStyle = o.col.body; ell(g, 0, 3, 18, 13);
  g.fillStyle = o.col.belly; ell(g, 5, 8, 11, 7);
  if (o.col.extra){ g.fillStyle = o.col.extra; ell(g, -9, 11, 5, 3.5); }
  g.fillStyle = shade(o.col.body, -28); ell(g, -4, 1, 11, 7, -0.2);

  g.fillStyle = '#fff'; circ(g, 17, -11, 2.7); g.fillStyle = '#111'; circ(g, 17.7, -11, 1.4);
  drawBeak(g, o.shape, o.col.beak);

  g.restore();
}
function drawOwl(g, x, y, s, t){

  g.fillStyle = '#f6e7c4'; circ(g, -5.5, -5, 5.5); circ(g, 5.5, -5, 5.5);

/* ---------- entities ---------- */
let ENTS = [];
function initEntities(){
  ENTS = [];
  const P0 = PTS[0];
  ENTS.push({ type:'tower', x:P0.center.x, y:P0.center.y + 8, r:44 });
  ENTS.push({ type:'npc', z:0, kind:'eule', x:P0.eule.x, y:P0.eule.y, r:14 });
  [['lexikon', 'Lexikon', '📖', '#8a4b2f'], ['laden', 'Laden', '🛒', '#2f6f8a'], ['altar', 'Morgen-Training', '🌅', '#b58a2a'], ['arena', 'Arena', '⚔️', '#7a2f4a']].forEach(([k, name, icon, roof]) =>
    ENTS.push({ type:'bld', kind:k, name, icon, roof, x:P0[k].x, y:P0[k].y, r:26 }));
  for (let z = 1; z <= 5; z++){
    const P = PTS[z];
    ENTS.push({ type:'npc', z, kind:NPCS[z].kind, x:P.npc.x, y:P.npc.y, r:14 });
    P.st.forEach((p, i) => ENTS.push({ type:'st', z, i, def:STATIONS[z][i], x:p.x, y:p.y, r:16 }));
    ENTS.push({ type:'boss', z, x:P.boss.x, y:P.boss.y, r:30 });
  }
  const rng = mulberry32(99);
  const MON_N = ['Nebel-Klecks', 'Vergiss-Mich', 'Grau-Wolke', 'Wort-Dieb'];
  for (let z = 1; z <= 5; z++){
    let placed = 0, tries = 0, fea = 0;
    while ((placed < 4 || fea < 10) && tries++ < 4000){
      const tx = Math.floor(rng() * MW), ty = Math.floor(rng() * MH), i = tI(tx, ty);
      if (zmap[i] !== z || tiles[i] !== T_GROUND) continue;
      const { d } = polar(tx + 0.5, ty + 0.5); if (d < 0.46 || d > 0.84) continue;
      const x = tx * TS + 16, y = ty * TS + 16;
      if (ENTS.some(e => e.type !== 'fea' && Math.hypot(e.x - x, e.y - y) < 110)) continue;
      if (placed < 4){ ENTS.push({ type:'mon', z, x, y, hx:x, hy:y, tx:x, ty:y, t:rng() * 9, seed:rng() * 9, name:MON_N[placed], alive:true, respawn:0 }); placed++; }
      else { ENTS.push({ type:'fea', z, x, y, taken:false, t:rng() * 6 }); fea++; }
    }
  }
}

/* ---------- collision ---------- */
function gateLocked(z){ return z > S.zone; }
function solidPx(px, py){
  const i = tileAtPx(px, py); if (i < 0) return true;
  const t = tiles[i];
  if (t === T_WATER || t === T_WALL) return true;
  if (t === T_GATE) return gateLocked(zmap[i]);
  return false;
}
function boxFree(x, y, r){ return !solidPx(x - r, y - r) && !solidPx(x + r, y - r) && !solidPx(x - r, y + r) && !solidPx(x + r, y + r); }
function moveBody(b, dx, dy, r){
  if (dx && boxFree(b.x + dx, b.y, r)) b.x += dx;
  if (dy && boxFree(b.x, b.y + dy, r)) b.y += dy;
}

/* ---------- objective ---------- */
function stationsDone(z){ let n = 0; for (let i = 0; i < 4; i++) if ((S.stations[z + '-' + i] || 0) >= 1) n++; return n; }
function objective(){
  if (!S.met[0]) return { text:'Sprich mit Professorin Eule im Nest-Dorf.', es:'Habla con la profesora Búho.', target:PTS[0].eule };
  for (let z = 1; z <= 5; z++){
    if (S.bosses[z]) continue;
    const Z = ZONES[z];
    if (!S.met[z]) return { text:`Geh in die ${Z.name} und sprich mit ${NPCS[z].name.replace(/^Die /, 'der ').replace(/^Der /, 'dem ')}.`, es:`Ve a ${Z.es} y habla con el guía.`, target:PTS[z].npc };
    const done = stationsDone(z);
    if (done < 3){
      let best = null; PTS[z].st.forEach((p, i) => { if (!(S.stations[z + '-' + i] >= 1) && !best) best = p; });
      return { text:`${Z.name}: Spiele an den Schreinen (${done}/4). Ab 3 ist der Boss offen.`, es:`Juega en los santuarios (${done}/4). Con 3 se abre el jefe.`, target:best };
    }
    return { text:`Besiege ${BOSSES[z].name.replace(/^Der /, 'den ').replace(/^Das /, 'das ')} in der ${Z.name}!`, es:`¡Vence a ${BOSSES[z].es}!`, target:PTS[z].boss };
  }
  if (!S.exams.some(e => e.pct >= 60)) return { text:'Stelle dich dem Vergess-Geier im Prüfungsturm (Mitte des Dorfes)!', es:'¡Enfréntate al Buitre del Olvido en la Torre del Examen!', target:PTS[0].center };
  return { text:'Alles geschafft! Mach das Lexikon golden und trainiere in der Arena.', es:'¡Lo lograste todo! Repasa el Lexikon y entrena en la Arena.', target:null };
}

/* ---------- overworld scene ---------- */
const player = { x:0, y:0, dir:1, t:0, moving:false, target:null, targetEnt:null, inv:0, zone:0, stepT:0 };
const cam = { x:0, y:0 };
const Overworld = {
  get pauseOnModal(){ return !this.demo; },
  demo:false, t:0, near:null, obj:null, objT:0,
  enter(){ $('#hud').hidden = false; $('#quest').hidden = this.demo; this.refreshObjective(); hud(); },
  exit(){},
  refreshObjective(){ this.obj = objective(); $('#quest').innerHTML = `<b>Ziel:</b> ${esc(this.obj.text)} <span class="es-inline">${esc(this.obj.es)}</span>`; },
  update(dt){
    this.t += dt;

      const a = this.t * 0.05;
      cam.x = CX * TS - W / 2 + Math.cos(a) * 520; cam.y = CY * TS - H / 2 + Math.sin(a) * 340;
      return;
    }

    let dy = (down('KeyS', 'ArrowDown') ? 1 : 0) - (down('KeyW', 'ArrowUp') ? 1 : 0);
    if (dx || dy){ player.target = null; player.targetEnt = null; }
    else if (player.target){

      const vx = player.x - e.x, vy = player.y - e.y, dd = Math.hypot(vx, vy), min = e.r + 10;

      if (z === 0 && S.hearts < S.maxHearts){ S.hearts = S.maxHearts; hud(); toast('♥ Im Nest-Dorf sind deine Herzen wieder voll.', ''); }

        const chase = dp < 170 && player.zone === e.z && player.inv <= 0;
        let gx = e.tx, gy = e.ty, sp = 38;
        if (chase){ gx = player.x; gy = player.y; sp = 72; }
        else if (Math.hypot(e.tx - e.x, e.ty - e.y) < 6){ e.tx = e.hx + (Math.random() - 0.5) * 180; e.ty = e.hy + (Math.random() - 0.5) * 180; }
        const vx = gx - e.x, vy = gy - e.y, dd = Math.hypot(vx, vy) || 1;
        moveBody(e, vx / dd * sp * dt, vy / dd * sp * dt, 10);
        if (!chase && Math.random() < dt * 0.3){ e.tx = e.hx + (Math.random() - 0.5) * 180; e.ty = e.hy + (Math.random() - 0.5) * 180; }
        if (dp < 24 && player.inv <= 0 && !modalOpen()){ startFight(e); return; }
      } else if (e.type === 'fea' && !e.taken){
        e.t += dt;
        if (Math.hypot(player.x - e.x, player.y - e.y) < 22){ e.taken = true; SFX.pick(); addFeathers(2); }
      }
    }

      const dd = Math.hypot(player.x - e.x, player.y - e.y) - e.r;

  },

const ZONE_SKY = [['#f6d9a0', '#d8c28e'], ['#a9dcf0', '#86c45f'], ['#3b3548', '#6d6478'], ['#6f8a7a', '#5f7a4a'], ['#5f9f6a', '#3f7d3a'], ['#cfe3f2', '#dfe8ee']];
function wq(ids, kinds){ const cand = pickWords(ids, 5); return qFromWord(pick(cand), kinds); }
function monsterQ(z){
  const own = topicIds(ZONES[z].topic);
  const all = unlockedTopics().flatMap(t => topicIds(t));
  return wq(Math.random() < 0.7 ? own : all, ['es2de', 'de2es', 'art', 'def', 'ex', 'audio']);
}
function bossQ(z, phase){
  const r = Math.random();
  if (z <= 3){
    const key = ZONES[z].topic, ids = topicIds(key), tf = TF.filter(x => x.t === key);
    if (phase === 0) return r < 0.35 ? qLabel(key) : wq(ids, ['es2de', 'de2es', 'art', 'def']);
    if (phase === 1) return r < 0.4 ? qLabel(key) : r < 0.7 ? qTF(pick(tf)) : wq(ids, ['art', 'ex', 'audio']);
    return r < 0.5 ? qLabelType(key) : wq(ids, ['type']);
  }
  if (z === 4){
    const ids = topicIds('schnabel');
    if (phase === 0) return qBeak();
    if (phase === 1) return r < 0.5 ? qBeak() : qTF(pick(TF.filter(x => x.t === 'schnabel')));
    return r < 0.4 ? wq(ids.filter(id => WMAP[id].art), ['type']) : r < 0.7 ? qFix(pick(BEAK_FIX)) : qBeak();
  }
  const ids = topicIds('merkmale');
  if (phase === 0) return qMerkmal();
  if (phase === 1) return r < 0.55 ? qTF(pick(TF.filter(x => x.t === 'merkmale'))) : qMerkmal();
  return r < 0.5 ? wq(ids, ['type', 'art']) : qMerkmal();
}
function qFix(item){
  return { type:'mc', prompt:`Welches Wort ist richtig?<div class="def">„${esc(item.s)}“</div>`, options:shuffle(item.o.map(o => ({ html:esc(o), val:o }))), correct:item.a,
    answerHTML:`<b>${esc(item.a)}</b>`, explain:esc(item.s.replace('___', item.a)), explainEs:esc(item.es), es:'¿Qué palabra está bien escrita / es correcta?', sayAfter:item.s.replace('___', item.a) };
}

const Battle = {
  pauseOnModal:false,
  begin(cfg){
    this.cfg = cfg; this.t = 0; this.fx = []; this.texts = []; this.shake = 0; this.eHit = 0; this.pHit = 0; this.proj = []; this.over = false;
    this.lunge = 0;
    $('#quest').hidden = true;
    setScene(this);
    panel.hidden = false; panel.innerHTML = '';
    this.run();
  },
  hearts(){ return this.cfg.arena ? this.cfg.aHearts : S.hearts; },
  phase(){ const e = this.cfg.enemy; const f = e.hp / e.max; return f > 0.66 ? 0 : f > 0.33 ? 1 : 2; },
  async run(){
    const c = this.cfg;
    if (c.intro){ await speech(c.enemy.name, c.intro[0], c.intro[1]); }
    else await sleep(500);
    while (!this.over){
      if (c.enemy.hp <= 0){
        if (c.arena){ c.score++; this.boom(720, 240, '#b3abc8', 30); SFX.win(); addFeathers(8); this.float(`+1 · Punkte: ${c.score}`, 720, 150, '#ffe9a8'); await sleep(900); c.enemy = arenaEnemy(c.score); continue; }
        break;
      }
      if (this.hearts() <= 0) break;
      const q = c.qgen(this.phase());
      const r = await askQ(q, panel, { compact:true, autoNext:900 });
      if (r.result === 'right' || r.result === 'close'){
        let dmg = r.result === 'close' ? 0.5 : 1, crit = false;
        if (c.boss && r.result === 'right' && r.ms < 6000){ dmg = 2; crit = true; }
        this.attack(dmg, crit);
      } else {
        this.enemyAttack();
      }
      await sleep(650);
    }
    this.finish(c.enemy.hp <= 0);
  },
  attack(dmg, crit){
    const c = this.cfg; SFX.shoot();
    this.proj.push({ x:250, y:230, t:0, crit });
    setTimeout(() => {
      c.enemy.hp = Math.max(0, c.enemy.hp - dmg); this.eHit = 0.35; this.shake = crit ? 10 : 5; SFX.hit();
      this.boom(720, 220, crit ? '#f2b632' : '#fff', crit ? 26 : 14);
      this.float((crit ? 'KRITISCH! ' : '') + '-' + dmg, 720, 130, crit ? '#ffd66b' : '#fff');
    }, 260);
  },
  enemyAttack(){
    const c = this.cfg; this.lunge = 0.5;
    setTimeout(() => {
      if (c.arena) c.aHearts--; else { S.hearts = Math.max(0, S.hearts - 1); save(); }
      this.pHit = 0.4; this.shake = 8; SFX.hit(); hud();
      this.float('-♥', 240, 150, '#ff8a7e'); this.boom(240, 230, '#ff8a7e', 12);
    }, 220);
  },
  boom(x, y, col, n){ for (let i = 0; i < n; i++){ const a = Math.random() * TAU, s = 60 + Math.random() * 200; this.fx.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 60, life:0.7 + Math.random() * 0.4, col }); } },
  float(txt, x, y, col){ this.texts.push({ txt, x, y, col, life:1.3 }); },
  finish(won){
    this.over = true; panel.hidden = true; panel.innerHTML = '';
    const c = this.cfg;
    setTimeout(() => c.onEnd(won), won ? 500 : 300);
  },
  update(dt){
    this.t += dt; this.eHit = Math.max(0, this.eHit - dt); this.pHit = Math.max(0, this.pHit - dt); this.shake = Math.max(0, this.shake - dt * 30); this.lunge = Math.max(0, this.lunge - dt);
    for (const p of this.fx){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    this.fx = this.fx.filter(p => p.life > 0);
    for (const t of this.texts){ t.y -= 30 * dt; t.life -= dt; }
    this.texts = this.texts.filter(t => t.life > 0);
    for (const p of this.proj) p.t += dt;
    this.proj = this.proj.filter(p => p.t < 0.3);
  },
  draw(g){
    const c = this.cfg, sky = ZONE_SKY[c.z] || ZONE_SKY[0];
    g.save();
    if (this.shake) g.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, sky[0]); gr.addColorStop(0.55, sky[1]); gr.addColorStop(1, shade(sky[1], -40));
    g.fillStyle = gr; g.fillRect(-20, -20, W + 40, H + 40);
    g.fillStyle = 'rgba(0,0,0,.12)'; ell(g, 240, 262, 90, 20); ell(g, 720, 262, 120, 26);
    // enemy
    const e = c.enemy, lx = this.lunge > 0 ? -Math.sin(this.lunge / 0.5 * Math.PI) * 160 : 0;
    g.save(); if (this.eHit > 0 && Math.floor(this.t * 30) % 2) g.globalAlpha = 0.4;
    e.draw(g, 720 + lx, 200, this.t);
    g.restore();
    // player
    g.save(); if (this.pHit > 0 && Math.floor(this.t * 30) % 2) g.globalAlpha = 0.4;
    drawRanger(g, 240, 205, 2.6, 1, this.t, false, S.hat && (SHOP.find(s => s.id === S.hat) || {}).emoji);
    g.restore();
    for (const p of this.proj){ const f = p.t / 0.3; drawEmoji(g, '🪶', 260 + f * 440, 200 - Math.sin(f * Math.PI) * 60, p.crit ? 34 : 26); }
    for (const p of this.fx){ g.globalAlpha = clamp(p.life, 0, 1); g.fillStyle = p.col; circ(g, p.x, p.y, 3.5); }
    g.globalAlpha = 1;
    for (const t of this.texts){ g.globalAlpha = clamp(t.life, 0, 1); textOut(g, t.txt, t.x, t.y, '28px "Lilita One", sans-serif', t.col); }
    g.globalAlpha = 1;
    // enemy HP bar
    const bw = 260, bx = W - bw - 24, by = 64;
    g.fillStyle = 'rgba(15,32,38,.8)'; rrect(g, bx - 8, by - 8, bw + 16, 44, 10);
    textOut(g, e.name, bx, by + 6, '17px "Lilita One", sans-serif', '#ffe9a8', 'rgba(15,32,38,.9)', 'left');
    g.fillStyle = '#3a2b33'; rrect(g, bx, by + 18, bw, 10, 5);
    g.fillStyle = e.hp / e.max > 0.33 ? '#e2742f' : '#ff4b3a'; rrect(g, bx, by + 18, Math.max(0, bw * e.hp / e.max), 10, 5);
    if (c.arena){ textOut(g, `Arena · Punkte: ${c.score} · ${'♥'.repeat(Math.max(0, c.aHearts))}`, 24, 76, '18px "Lilita One", sans-serif', '#ffe9a8', 'rgba(15,32,38,.9)', 'left'); }
    else if (c.boss){ const ph = ['Phase 1: Auswählen', 'Phase 2: Bilder & Sätze', 'Phase 3: Schreiben!'][this.phase()]; textOut(g, ph, 24, 76, '17px "Lilita One", sans-serif', '#ffe9a8', 'rgba(15,32,38,.9)', 'left'); }
    g.restore();
  },
};

/* ---------- Lückentext ---------- */
function parseCloze(text){
  const out = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push({ t:text.slice(last, m.index) });
    const [shown, id] = m[1].split('|');
    out.push({ blank:true, shown, id:id || idOf(shown) });
    last = re.lastIndex;
  }
  if (last < text.length) out.push({ t:text.slice(last) });
  return out;
}
async function gameCloze(key){

    const extra = sample(WORDS.filter(w => w.t === topic && !blanks.some(b => b.shown === w.de) && w.art), 2).map(w => w.de);
    const bank = shuffle([...blanks.map((b, k) => ({ text:b.shown, k })), ...extra.map(t => ({ text:t, k:-1 }))]);
    const fill = new Array(blanks.length).fill(null);
    let sel = 0, checked = false;
    const res = await new Promise(done => {
      const render = () => {
        let bi = 0;
        const body = toks.map(t => {
          if (!t.blank) return esc(t.t);

        }).join('');

        $$('.gap', sheet).forEach(b => b.onclick = () => { if (checked) return; const k = +b.dataset.k; if (fill[k] != null){ fill[k] = null; } sel = k; render(); });

      };

      render();
    });

  }
  closeModal();

}

  if (j) j.onclick = () => { if (S.jokers <= 0) return; S.jokers--; save(); sheet.querySelector('.task-es').hidden = false; j.disabled = true; sheet.querySelector('.exam-meta').textContent = sheet.querySelector('.exam-meta').textContent.replace(/🃏 \d+/, '🃏 ' + S.jokers); };
  return new Promise(res => {
    $('#ex-submit').onclick = () => {
      const r = onSubmit();
      $('#ex-actions').innerHTML = `<span class="score-note">+${Math.round(r.p * 10) / 10} / ${r.m} Punkte</span><button class="btn" id="ex-next" type="button">Weiter</button>`;
      sheet.querySelectorAll('input, select, textarea').forEach(x => x.disabled = true);
      r.p > r.m / 2 ? SFX.hit() : SFX.bad();
      $('#ex-next').onclick = () => res(r);
    };
  });
}
async function runSection(E, title, r0){ const r = await r0; E.got += r.p; E.rows.push({ t:title, p:r.p, m:r.m }); }

function secLabel(E, key, task, taskEs){
  const D = DIAGRAMS[key];
  const body = `<div class="label-wrap"><div class="diag-box">${diagramSVG(key)}</div><ol class="slots exam">${D.labels.map(L => `<li><span class="num">${L.n}</span><input type="text" id="lb-${key}-${L.n}" autocomplete="off" spellcheck="false" aria-label="Nummer ${L.n}"><span class="fix"></span></li>`).join('')}</ol></div>${umlautBar()}`;
  openModal(examFrame(E, D.title, task, taskEs, body), 'wide exam');
  return runSection(E, D.title, wireFrame(() => {
    let p = 0;
    D.labels.forEach(L => {
      const inp = $(`#lb-${key}-${L.n}`), r = checkTyped(inp.value, labelAccepts(L)), pts = typedPoints(r); p += pts;
      if (WMAP[L.id]) grade(L.id, r.res);
      inp.classList.add(pts === 1 ? 'right' : pts > 0 ? 'close' : 'wrong');
      if (pts < 1) inp.nextElementSibling.innerHTML = labelHTML(L);
    });
    return { p, m:D.labels.length };
  }));
}
function secMerkmale(E){
  const body = `<div class="grid2">${Array.from({ length:10 }, (_, k) => `<input type="text" id="mm-${k}" placeholder="${k + 1}." autocomplete="off" aria-label="Merkmal ${k + 1}">`).join('')}</div>${umlautBar()}<div id="mm-sol"></div>`;
  openModal(examFrame(E, 'Die Merkmale der Vögel', 'Nenne die zehn verschiedenen Merkmale der Vögel.', 'Nombra las diez características distintas de las aves (basta con palabras clave).', body), 'wide exam');
  return runSection(E, 'Zehn Merkmale', wireFrame(() => {
    const used = new Set(); let p = 0, extra = false;
    for (let k = 0; k < 10; k++){
      const inp = $('#mm-' + k), t = fold(inp.value);
      if (!t.trim()){ inp.classList.add('wrong'); continue; }
      const i = MERKMALE.findIndex((m, j) => !used.has(j) && m.re.test(t));
      if (i >= 0){ used.add(i); p++; inp.classList.add('right'); }
      else if (!extra && MERKMAL_EXTRA.re.test(t)){ extra = true; p++; inp.classList.add('right'); }
      else inp.classList.add('wrong');
    }
    $('#mm-sol').innerHTML = `<p class="sol"><b>Musterlösung:</b> ${MERKMALE.map((m, j) => `<span class="${used.has(j) ? 'hit' : 'miss'}">${esc(m.short)}</span>`).join(' · ')} <span class="muted">(auch richtig: Wirbeltiere)</span></p>`;
    return { p:Math.min(10, p), m:10 };
  }));
}

function portrait(kind){
  const c = document.createElement('canvas'); c.width = 240; c.height = 240; c.className = 'portrait';
  const g = c.getContext('2d'); g.scale(2, 2);
  g.fillStyle = '#e9dcbc'; g.beginPath(); g.arc(60, 60, 58, 0, TAU); g.fill();
  if (kind === 'geier') drawBoss(g, 'geier', 64, 60, 2.2, 0);
  else if (BOSSES[kind]) drawBoss(g, BOSSES[kind].kind, 64, 60, 2.2, 0);
  else drawNPC(g, kind, 58, 62, 2.4, 0, 1);
  return c;
}
function dialogLines(name, lines, kind){
  return new Promise(res => {
    let k = 0;
    const render = () => {
      const [de, es] = lines[k];
      openModal(`<div class="dlg"><div class="dlg-face"></div><div class="dlg-body"><div class="who">${esc(name)}</div>
        <p class="de">${esc(de)} ${speakBtn(de)}</p><p class="es" ${S.settings.es ? '' : 'hidden'} id="dlg-es">${esc(es)}</p>
        <div class="fb-actions"><span class="dots">${lines.map((_, i) => `<i class="${i === k ? 'on' : ''}"></i>`).join('')}</span>
        <button class="btn tiny ghost" id="dlg-es-b" type="button">🇪🇸 Español</button>
        ${k < lines.length - 1 ? '<button class="btn tiny ghost" id="dlg-skip" type="button">Überspringen</button>' : ''}
        <button class="btn" id="dlg-next" type="button">${k < lines.length - 1 ? 'Weiter ⏎' : 'Okay! ⏎'}</button></div></div></div>`);
      sheet.querySelector('.dlg-face').appendChild(portrait(kind));
      $('#dlg-es-b').onclick = () => { $('#dlg-es').hidden = !$('#dlg-es').hidden; };
      $('#dlg-next').onclick = next;
      const sk = $('#dlg-skip'); if (sk) sk.onclick = end;
      speak(de, 0.9);
    };
    const next = () => { k++; if (k >= lines.length) end(); else render(); };
    const end = () => { pop(); if (HAS_TTS) speechSynthesis.cancel(); closeModal(); res(); };
    const pop = pushKeys(e => { if (e.code === 'Enter' || e.code === 'Space'){ next(); return true; } if (e.code === 'Escape'){ end(); return true; } return false; });
    render();
  });
}

    const q = fold(lexQ.trim());
    const list = WORDS.filter(w => q ? (fold(w.de).includes(q) || fold(w.es).includes(q)) : w.t === lexTab);

    openModal(`<div class="series-head"><h2>📖 Vogel-Lexikon</h2><div class="prog">🥇 ${counts[3]} · 🥈 ${counts[2]} · 🥉 ${counts[1]} · ${Math.round((counts[1] + counts[2] * 2 + counts[3] * 3) / (all * 3) * 100)} %</div></div>

      <div class="tabs">${Object.keys(TOPICS).map(t => `<button class="tab ${t === lexTab && !lexQ ? 'on' : ''}" type="button" data-t="${t}">${esc(TOPICS[t])}</button>`).join('')}<input type="search" id="lex-q" placeholder="Suchen (Deutsch oder Spanisch)" value="${esc(lexQ)}" aria-label="Suchen"></div>

      <div class="fb-actions"><button class="btn" id="lx-ok" type="button">Schließen</button></div>`, 'wide', { closable:true });

/* ---------- shop ---------- */
function openShop(){
  const render = () => {
    const rows = SHOP.map(it => {
      let act;
      if (it.type === 'hat'){
        if (S.owned[it.id]) act = S.hat === it.id ? `<button class="btn tiny ghost" data-a="off" data-id="${it.id}" type="button">Absetzen</button>` : `<button class="btn tiny alt" data-a="on" data-id="${it.id}" type="button">Aufsetzen</button>`;
        else act = `<button class="btn tiny" data-a="buy" data-id="${it.id}" type="button" ${S.feathers < it.price ? 'disabled' : ''}>${it.price} 🪶</button>`;
      } else if (it.type === 'heart') act = S.maxHearts >= 8 ? '<span class="muted">Maximum</span>' : `<button class="btn tiny" data-a="buy" data-id="${it.id}" type="button" ${S.feathers < it.price ? 'disabled' : ''}>${it.price} 🪶</button>`;
      else act = `<button class="btn tiny" data-a="buy" data-id="${it.id}" type="button" ${S.feathers < it.price ? 'disabled' : ''}>${it.price} 🪶</button>`;
      return `<div class="shop-row"><span class="shop-ico">${it.emoji}</span><span class="shop-name">${esc(it.name)}${it.type === 'joker' ? ` <span class="muted">(du hast ${S.jokers})</span>` : it.type === 'heart' ? ` <span class="muted">(jetzt ${S.maxHearts})</span>` : ''}</span>${act}</div>`;
    }).join('');
    openModal(`<div class="series-head"><h2>🛒 Laden</h2><div class="prog">🪶 ${S.feathers}</div></div><p class="sub">Tausche deine Federn. <span class="es-inline">Cambia tus plumas por premios.</span></p>${rows}
      <div class="fb-actions"><button class="btn" id="sh-ok" type="button">Schließen</button></div>`, '', { closable:true });
    $$('[data-a]', sheet).forEach(b => b.onclick = () => {
      const it = SHOP.find(s => s.id === b.dataset.id), a = b.dataset.a;
      if (a === 'on') S.hat = it.id; else if (a === 'off') S.hat = null;
      else if (S.feathers >= it.price){
        S.feathers -= it.price; SFX.pick();
        if (it.type === 'hat'){ S.owned[it.id] = true; S.hat = it.id; }
        else if (it.type === 'heart'){ S.maxHearts++; S.hearts = S.maxHearts; }
        else S.jokers++;
        toast(`${it.emoji} ${esc(it.name)} gekauft!`, 'ok');
      }
      save(); hud(); render();
    });
    $('#sh-ok').onclick = closeModal;
  };
  render();
}

  if (!go){ closeModal(); return; }
  const qs = pickWords(ids, 10).map(id => qFromWord(id, ['es2de', 'de2es', 'art', 'def', 'ex', 'audio', 'type', 'type']));
  const r = await runSeries('🌅 Morgen-Training', qs);
  if (first){ S.lastDaily = todayStr(); S.dailyDays++; addFeathers(40); if (S.dailyDays >= 3) badge('daily3'); }
  S.stats.days[todayStr()] = (S.stats.days[todayStr()] || 0) + 1; save();
  openModal(`<div class="center"><h2>Training fertig!</h2><p class="score-big">${r.correct} / ${r.total}</p><p class="es">¡Bien hecho! Vuelve mañana para el siguiente repaso.</p><div class="fb-actions"><button class="btn" id="dy-ok" type="button">Weiter</button></div></div>`);
  $('#dy-ok').onclick = closeModal;
}

/* ---------- interactions ---------- */
function interact(e){
  player.target = null; player.targetEnt = null;
  if (e.type === 'npc') return talkNPC(e.z);
  if (e.type === 'st') return startStation(e.z, e.i);
  if (e.type === 'boss'){
    if (!S.bosses[e.z] && stationsDone(e.z) < 3){ toast(`🔒 Spiele zuerst an 3 Schreinen (${stationsDone(e.z)}/3).`); return; }
    return bossConfirm(e.z);
  }
  if (e.type === 'bld'){ ({ lexikon:openLexikon, laden:openShop, altar:startDaily, arena:arenaConfirm })[e.kind](); return; }
  if (e.type === 'tower'){
    if (!(S.bosses[5] || S.unlockAll)){ toast('🔒 Der Prüfungsturm öffnet sich, wenn alle 5 Bosse besiegt sind.'); return; }
    startExam();
  }
}
function bossConfirm(z){
  const B = BOSSES[z];
  openModal(`<div class="dlg"><div class="dlg-face"></div><div class="dlg-body"><div class="who">${esc(B.name)} <span class="es-inline">${esc(B.es)}</span></div>
    <p>Bosskampf in drei Phasen: <b>Auswählen</b> → <b>Bilder &amp; Sätze</b> → <b>Schreiben</b>. Schnelle richtige Antworten (unter 6 Sekunden) sind kritische Treffer!</p>
    <p class="es">Combate en tres fases: elegir → imágenes y frases → escribir. ¡Las respuestas rápidas hacen daño doble! Tus corazones se rellenan antes del combate.</p>
    <div class="fb-actions"><button class="btn ghost" id="bc-no" type="button">Noch nicht</button><button class="btn" id="bc-go" type="button">Kämpfen! ⚔️</button></div></div></div>`, '', { closable:true });
  sheet.querySelector('.dlg-face').appendChild(portrait(z));
  $('#bc-no').onclick = closeModal;
  $('#bc-go').onclick = () => { closeModal(); S.hearts = S.maxHearts; hud(); startBoss(z); };
}
function arenaConfirm(){
  openModal(`<div class="center"><div class="big-emoji">⚔️</div><h2>Arena</h2><p>Endlos-Kampf mit den Wörtern, die dir noch schwerfallen. Du hast 3 Arena-Herzen. Rekord: <b>${S.arenaBest}</b></p>
    <p class="es">Combate sin fin con las palabras que aún te cuestan. Tienes 3 corazones de arena.</p>
    <div class="fb-actions"><button class="btn ghost" id="an-no" type="button">Zurück</button><button class="btn" id="an-go" type="button">Start!</button></div></div>`, '', { closable:true });
  $('#an-no').onclick = closeModal; $('#an-go').onclick = () => { closeModal(); startArena(); };
}

/* ---------- menu ---------- */
function openMenu(){
  const zs = [1, 2, 3, 4, 5].filter(z => z <= S.zone || S.met[z]);
  openModal(`<h2>Menü</h2><div class="menu-grid">
      <button class="btn" id="m-resume" type="button">▶ Weiterspielen</button>
      <button class="btn alt" id="m-lex" type="button">📖 Lexikon (B)</button>
      <button class="btn alt" id="m-badges" type="button">🏅 Abzeichen</button>
      <button class="btn alt" id="m-settings" type="button">⚙️ Einstellungen</button>
      <button class="btn alt" id="m-help" type="button">❓ Hilfe / Ayuda</button>
      <button class="btn ghost hold" id="m-parents" type="button"><span class="fill"></span>👪 Eltern-Bereich (gedrückt halten)</button>
    </div>
    <h3>📘 Lernkarten</h3><div class="menu-grid">${zs.map(z => `<button class="btn ghost" data-lk="${z}" type="button">${esc(ZONES[z].name)} · ${esc(TOPICS[ZONES[z].topic])}</button>`).join('')}</div>`, '', { closable:true });
  $('#m-resume').onclick = closeModal; $('#m-lex').onclick = openLexikon; $('#m-badges').onclick = openBadges; $('#m-settings').onclick = openSettings; $('#m-help').onclick = openHelp;
  $$('[data-lk]', sheet).forEach(b => b.onclick = () => openLernkarte(+b.dataset.lk));
  holdButton($('#m-parents'), openParents);
}
function holdButton(btn, fn){
  let t = null;
  const start = e => { e.preventDefault(); btn.classList.add('holding'); t = setTimeout(() => { btn.classList.remove('holding'); fn(); }, 1500); };
  const stop = () => { clearTimeout(t); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}
function openBadges(){
  openModal(`<h2>🏅 Abzeichen</h2><div class="badges">${Object.entries(BADGES).map(([k, b]) => `<div class="badge ${S.badges[k] ? 'on' : ''}"><span class="bi">${b.i}</span><b>${esc(b.n)}</b><small>${esc(b.d)}</small></div>`).join('')}</div>
    <p class="muted">Beste Serie: ${S.bestCombo} · Arena-Rekord: ${S.arenaBest} · Richtige Artikel: ${S.artRight}</p><div class="fb-actions"><button class="btn" id="bd-ok" type="button">Zurück</button></div>`, '', { closable:true });
  $('#bd-ok').onclick = openMenu;
}
function openSettings(){
  const row = (id, label, on) => `<label class="set-row"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
  openModal(`<h2>⚙️ Einstellungen</h2>
    ${row('st-sound', 'Geräusche <span class="es-inline">sonidos</span>', S.settings.sound)}
    ${row('st-tts', 'Deutsche Stimme (Wörter vorlesen) <span class="es-inline">voz en alemán</span>', S.settings.tts)}
    ${row('st-es', 'Spanische Hilfe immer zeigen <span class="es-inline">mostrar siempre la ayuda en español</span>', S.settings.es)}
    <p class="muted">${HAS_TTS ? (deVoice ? `Stimme: ${esc(deVoice.name)}` : 'Keine deutsche Stimme gefunden. Tipp: In den Systemeinstellungen eine deutsche Stimme installieren.') : 'Dieser Browser kann nicht vorlesen.'} <button class="btn tiny ghost" type="button" data-say="Der Schnabel. Die Kloake. Das Brustbein.">🔊 Test</button></p>
    <label class="set-row">Name: <input type="text" id="st-name" value="${esc(S.name)}" maxlength="20"></label>
    <div class="fb-actions"><button class="btn" id="se-ok" type="button">Fertig</button></div>`, '', { closable:true });
  $('#st-sound').onchange = e => { S.settings.sound = e.target.checked; hud(); save(); };
  $('#st-tts').onchange = e => { S.settings.tts = e.target.checked; hud(); save(); };
  $('#st-es').onchange = e => { S.settings.es = e.target.checked; save(); };
  $('#st-name').onchange = e => { S.name = e.target.value.trim() || 'Ranger'; save(); };
  $('#se-ok').onclick = openMenu;
}
function openHelp(){
  openModal(`<h2>❓ So spielst du</h2>
    <table class="res-table help"><tr><td>WASD / Pfeiltasten</td><td>laufen · caminar</td></tr><tr><td>Mausklick</td><td>hinlaufen · ir al punto</td></tr><tr><td>E / Enter / Leertaste</td><td>sprechen, spielen · hablar, jugar</td></tr>
    <tr><td>1–4</td><td>Antwort wählen · elegir respuesta</td></tr><tr><td>J / K / L</td><td>der / die / das</td></tr><tr><td>R / F</td><td>richtig / falsch</td></tr><tr><td>B</td><td>Lexikon</td></tr><tr><td>Esc</td><td>Menü</td></tr></table>
    <h3>Der Plan für die Prüfung</h3><ol><li><b>Tag 1:</b> Federwiese + Knochenhöhle (Körper außen, Skelett).</li><li><b>Tag 2:</b> Morgen-Training, dann Magen-Moor + Schnabel-Wald.</li><li><b>Tag 3:</b> Morgen-Training, Merkmal-Gipfel, dann der Prüfungsturm. Danach: Arena und Lexikon, bis alles Gold ist.</li></ol>
    <p class="es">Plan: día 1 – cuerpo y esqueleto; día 2 – órganos y picos; día 3 – características y examen de prueba. Cada día empieza en el Altar de la Mañana.</p>
    <p><b>Farben:</b> <span class="art-der">der = blau</span> · <span class="art-die">die = rot</span> · <span class="art-das">das = grün</span>. <b>Sterne:</b> ab 60 % ★, ab 80 % ★★, ab 95 % ★★★.</p>
    <div class="fb-actions"><button class="btn" id="hp-ok" type="button">Zurück</button></div>`, 'wide', { closable:true });
  $('#hp-ok').onclick = openMenu;
}

/* ---------- parent area ---------- */
function openParents(){
  const h = Math.floor(S.stats.ms / 3600000), m = Math.floor(S.stats.ms / 60000) % 60;
  const counts = [0, 0, 0, 0]; WORDS.forEach(w => counts[tier(w.id)]++);
  const topicRows = Object.keys(TOPICS).map(t => { const s = S.stats.topic[t] || { r:0, w:0 }, n = s.r + s.w, p = n ? Math.round(s.r / n * 100) : 0;
    return `<tr><td>${esc(TOPICS[t])}</td><td><div class="pbar"><i style="width:${p}%"></i></div></td><td class="num">${n ? p + ' %' : '–'}</td><td class="num muted">${n}</td></tr>`; }).join('');
  const weak = WORDS.filter(w => S.words[w.id] && S.words[w.id].w > 0).sort((a, b) => (S.words[b.id].w - S.words[b.id].r * 0.3) - (S.words[a.id].w - S.words[a.id].r * 0.3)).slice(0, 15);
  const st = [1, 2, 3, 4, 5].map(z => `<tr><td>${esc(ZONES[z].name)}</td>${[0, 1, 2, 3].map(i => `<td>${'★'.repeat(S.stations[z + '-' + i] || 0) || '·'}</td>`).join('')}<td>${S.bosses[z] ? '✔' : '–'}</td></tr>`).join('');
  openModal(`<div class="series-head"><h2>👪 Eltern-Bereich</h2><div class="prog">${esc(S.name)}</div></div>
    <p class="muted">Spielzeit: ${h} h ${m} min · Tage mit Training: ${Object.keys(S.stats.days).length} (${Object.keys(S.stats.days).slice(-5).join(', ') || '–'}) · Lexikon: 🥇 ${counts[3]} 🥈 ${counts[2]} 🥉 ${counts[1]} von ${WORDS.length}</p>
    <h3>Treffer pro Thema</h3><table class="res-table">${topicRows}</table>
    <h3>Schwierige Wörter</h3>${weak.length ? `<table class="res-table">${weak.map(w => `<tr><td>${wordHTML(w)}</td><td>${esc(w.es)}</td><td class="num">✘ ${S.words[w.id].w} / ✔ ${S.words[w.id].r}</td><td>${TIER_NAME[tier(w.id)]}</td></tr>`).join('')}</table>` : '<p class="muted">Noch keine Fehler gespeichert.</p>'}
    <h3>Schreine und Bosse</h3><table class="res-table"><tr><th>Zone</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Boss</th></tr>${st}</table>
    <h3>Prüfungsturm</h3><p>${S.exams.length ? S.exams.slice(-6).map(e => `${e.date}: <b>${e.pct} %</b> (Note ~${e.note})`).join(' · ') : '<span class="muted">Noch nicht gemacht.</span>'}</p>
    <h3>Werkzeuge</h3>
    <div class="menu-grid"><button class="btn alt" id="pa-unlock" type="button">🔓 Alle Zonen und den Turm öffnen</button><button class="btn alt" id="pa-export" type="button">💾 Spielstand sichern</button><button class="btn alt" id="pa-import" type="button">📥 Spielstand laden</button><button class="btn ghost" id="pa-reset" type="button">🗑 Alles zurücksetzen</button></div>
    <div id="pa-io"></div>
    <div class="fb-actions"><button class="btn" id="pa-ok" type="button">Schließen</button></div>`, 'wide', { closable:true });
  $('#pa-ok').onclick = closeModal;
  $('#pa-unlock').onclick = () => { S.zone = 5; S.unlockAll = true; save(); Overworld.refreshObjective(); toast('🔓 Alle Zonen und der Prüfungsturm sind offen.', 'ok'); };
  $('#pa-export').onclick = () => {
    const code = exportCode();
    $('#pa-io').innerHTML = `<p>Kopiere diesen Code und bewahre ihn auf (z. B. in einer Notiz). Damit kannst du den Spielstand auf einem anderen Gerät laden.</p><textarea id="pa-code" rows="4" readonly>${code}</textarea><button class="btn tiny" id="pa-copy" type="button">Kopieren</button>`;
    $('#pa-copy').onclick = () => { const ta = $('#pa-code'); navigator.clipboard.writeText(code).then(() => toast('Kopiert!', 'ok'), () => { ta.focus(); ta.select(); toast('Bitte mit Cmd/Strg+C kopieren.'); }); };
  };
  $('#pa-import').onclick = () => {
    $('#pa-io').innerHTML = `<p>Füge hier einen gesicherten Code ein:</p><textarea id="pa-in" rows="4"></textarea><button class="btn tiny" id="pa-load" type="button">Laden</button>`;
    $('#pa-load').onclick = () => { try { importCode($('#pa-in').value); location.reload(); } catch (e) { toast('Dieser Code ist ungültig. Bitte den ganzen Code einfügen.', 'bad'); } };
  };
  $('#pa-reset').onclick = () => {
    $('#pa-io').innerHTML = `<p><b>Wirklich alles löschen?</b> Sterne, Federn, Lexikon und Statistik gehen verloren.</p><button class="btn tiny" id="pa-yes" type="button">Ja, alles löschen</button> <button class="btn tiny ghost" id="pa-no" type="button">Abbrechen</button>`;
    $('#pa-no').onclick = () => { $('#pa-io').innerHTML = ''; };
    $('#pa-yes').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = defaultState(); saveNow(); location.reload(); };
  };
}

/* ---------- title ---------- */
function showTitle(){
  $('#hud').hidden = true; $('#quest').hidden = true;
  const cont = S.started;
  openModal(`<div class="title-screen"><p class="eyebrow">Biologie · Die Vögel</p><h1>Die Vogel-Insel</h1>
    <p class="tagline">Ein Abenteuer über den Körperbau, das Skelett, die Organe, die Schnäbel und die Merkmale der Vögel.</p>
    <p class="es">Una aventura para aprender en alemán todo lo del examen de biología sobre las aves.</p>
    <label class="name-row">Dein Name: <input type="text" id="t-name" value="${esc(S.name)}" maxlength="20"></label>
    <div class="fb-actions center-actions"><button class="btn big" id="t-go" type="button">${cont ? 'Weiterspielen ▶' : 'Abenteuer starten ▶'}</button></div>
    <p class="muted small">Ton an! Die Wörter werden auf Deutsch vorgelesen. · WASD / Pfeiltasten · E · Esc</p></div>`, 'title');
  const go = () => {
    pop(); ac(); S.name = ($('#t-name').value || '').trim() || 'Ranger'; S.started = true; save(); closeModal();
    Overworld.demo = false;
    const p = S.pos && boxFree(S.pos.x, S.pos.y, 9) ? S.pos : PTS[0].spawn;
    player.x = p.x; player.y = p.y; player.zone = (() => { const i = tileAtPx(p.x, p.y); return i >= 0 ? zmap[i] : 0; })();
    cam.x = clamp(Math.round(player.x - W / 2), 0, MW * TS - W); cam.y = clamp(Math.round(player.y - H / 2), 0, MH * TS - H);
    setScene(Overworld);
    if (!S.met[0]) setTimeout(() => talkNPC(0), 300);
    else if (S.lastDaily !== todayStr()) setTimeout(() => toast('🌅 Das Morgen-Training wartet am Altar im Dorf! (+40 🪶)', 'gold'), 800);
  };
  const pop = pushKeys(e => { if (e.code === 'Enter' && !isField(e.target)){ go(); return true; } return false; });
  $('#t-go').onclick = go;
}

/* ---------- boot ---------- */
function boot(){
  genWorld(); renderWorld(); initEntities();
  $('#b-sound').onclick = () => { S.settings.sound = !S.settings.sound; save(); hud(); };
  $('#b-tts').onclick = () => { S.settings.tts = !S.settings.tts; save(); hud(); toast(S.settings.tts ? '🗣 Stimme an' : '🗣 Stimme aus'); };
  $('#b-lex').onclick = () => { if (!modalOpen() && scene === Overworld) openLexikon(); };
  $('#b-menu').onclick = () => { if (!modalOpen() && scene === Overworld) openMenu(); };
  modal.addEventListener('pointerdown', e => { if (e.target === modal && modal.dataset.closable === '1') closeModal(); });
  Overworld.demo = true; setScene(Overworld); hud();
  requestAnimationFrame(frame);
  showTitle();
}
boot();
</script>
</body></html>
