<canvas id="cv" tabindex="0" aria-label="3D-Spielwelt der Vogel-Insel"></canvas>
<div id="hud" hidden>
  <div class="hud-l">
    <div class="pill" id="h-hearts" aria-label="Herzen"></div>
    <div class="pill" title="Federn">🪶 <span id="h-feathers">0</span></div>
    <div class="pill lvl"><span id="h-level">LV 1</span><span id="h-title"></span><span class="xpbar"><i id="h-xp"></i></span></div>
    <div class="pill" id="h-combo" hidden></div>
  </div>
  <div class="hud-r">
    <button class="iconbtn" id="b-sound" type="button" aria-label="Geräusche an oder aus">🔊</button>
    <button class="iconbtn" id="b-tts" type="button" aria-label="Deutsche Stimme an oder aus" title="Deutsche Stimme">🗣</button>
    <button class="iconbtn" id="b-lex" type="button" aria-label="Wort-Inventar öffnen" title="Wort-Inventar (B)">📖</button>
    <button class="iconbtn" id="b-menu" type="button" aria-label="Menü öffnen" title="Menü (M)">☰</button>
  </div>
</div>
<div id="banner" hidden><div class="b-main"></div><div class="b-sub"></div></div>
<div id="astat" hidden></div>
<div id="crosshair" hidden></div>
<div id="ammo" hidden></div>
<div id="prompt" hidden></div>
<div id="quest" hidden></div>
<div id="clickhint" hidden>Klick ins Spiel = Maus-Kamera · Esc = Maus frei · M = Menü</div>
<div id="toasts" aria-live="polite"></div>
<div id="popups"></div>
<div id="hurt"></div>
<div id="panel" hidden></div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
